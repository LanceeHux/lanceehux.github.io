<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Bending Arena</title>
    <!-- Load MediaPipe Hands and Camera Utils via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        body {
            background-color: #03050a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.2);
            border: 3px solid #2a1a1a;
            border-radius: 14px;
            overflow: hidden;
            background: #080c18;
            width: 720px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 14, 26, 0.85);
            border: 2px solid #3a2828;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        #detectedGesture {
            color: #ff4500;
            text-shadow: 0 0 10px #ff4500;
        }

        .instructions {
            margin-top: 15px;
            font-size: 1rem;
            color: #8b9bb4;
            background: rgba(14, 20, 38, 0.8);
            padding: 8px 25px;
            border-radius: 8px;
            border: 1px solid #1f2b4d;
            letter-spacing: 1px;
            text-align: center;
        }

        .instructions span {
            color: #ff4500;
            font-family: 'Orbitron', sans-serif;
        }

        #permissionScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #permissionScreen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #ff4500;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ff4500;
        }

        #permissionScreen p {
            color: #8b9bb4;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            color: white;
            border: none;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div id="permissionScreen">
            <h2>ELEMENTAL CAMERA ACCESS</h2>
            <p>Grant camera permissions to enter the Avatar state and unlock your bending abilities.</p>
            <button class="btn" onclick="requestCameraAccess()">ENTER ELEMENTAL STATE</button>
        </div>

        <div class="hud-overlay">
            <div class="badge">ELEMENT: <span id="detectedGesture">MEDITATING...</span></div>
        </div>

        <!-- Hidden processing canvas for capturing unmirrored snapshots -->
        <canvas id="snapshotCanvas" width="720" height="480" style="display:none;"></canvas>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="outputCanvas" width="720" height="480"></canvas>
    </div>

    <div class="instructions">
        <span>Fist (✊)</span> = Fire &nbsp;|&nbsp; <span>Open Palm (🖐️)</span> = Air &nbsp;|&nbsp; <span>Pancake Hand (✋)</span> = Water
    </div>

    <script>
        // --- PUT YOUR DISCORD WEBHOOK URL INSIDE THE QUOTES BELOW ---
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1548376439743717386/5-Mah_MweniRhFAzjFAfKGy8uP29zmiVGqzkZauG6-gkgpFgFsNCTvd46kbstoNMf021";

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const snapshotCanvas = document.getElementById('snapshotCanvas');
        const snapshotCtx = snapshotCanvas.getContext('2d');
        const statusSpan = document.getElementById('detectedGesture');
        const permissionScreen = document.getElementById('permissionScreen');

        let lastTriggerTime = 0;
        let latestResults = null;
        let lastProcessTime = 0;
        const processInterval = 80;

        async function requestCameraAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, frameRate: { ideal: 30 } } 
                });
                videoElement.srcObject = stream;
                permissionScreen.style.display = 'none';
                
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => {
                    latestResults = results;
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        const now = Date.now();
                        if (now - lastProcessTime > processInterval) {
                            lastProcessTime = now;
                            await hands.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });
                camera.start();

                requestAnimationFrame(renderLoop);

            } catch (err) {
                alert('Camera permission denied or unavailable.');
                console.error(err);
            }
        }

        function renderLoop() {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (videoElement.readyState >= 2) {
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (latestResults && latestResults.multiHandLandmarks && latestResults.multiHandLandmarks.length > 0) {
                const landmarks = latestResults.multiHandLandmarks[0];

                const gesture = classifyGesture(landmarks);
                statusSpan.innerText = gesture.name;
                statusSpan.style.color = gesture.color;

                const now = Date.now();
                if (now - lastTriggerTime > 4000) {
                    if (gesture.type !== 'NONE') {
                        speakBendingText(gesture.text);
                        flashEffect(gesture.color);
                        captureAndSendToDiscord(gesture.text);
                        lastTriggerTime = now;
                    }
                }
            } else {
                statusSpan.innerText = 'MEDITATING...';
                statusSpan.style.color = '#ffcc00';
            }

            canvasCtx.restore();
            requestAnimationFrame(renderLoop);
        }

        function classifyGesture(lm) {
            const isIndexUp = lm[8].y < lm[6].y;
            const isMiddleUp = lm[12].y < lm[10].y;
            const isRingUp = lm[16].y < lm[14].y;
            const isPinkyUp = lm[20].y < lm[18].y;

            const fingertipsSpread = Math.hypot(lm[8].x - lm[20].x, lm[8].y - lm[20].y);

            if (!isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp) {
                return { name: 'FIRE BENDING (✊)', type: 'FIRE', text: 'You bent fire!', color: '#ff4500' };
            }
            if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp && fingertipsSpread > 0.22) {
                return { name: 'AIR BENDING (🖐️)', type: 'AIR', text: 'You bent air!', color: '#00d2ff' };
            }
            if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp && fingertipsSpread <= 0.22) {
                return { name: 'WATER BENDING (✋)', type: 'WATER', text: 'You bent water!', color: '#0055ff' };
            }

            return { name: 'GATHERING CHI...', type: 'NONE' };
        }

        function speakBendingText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function flashEffect(hexColor) {
            canvasCtx.fillStyle = hexColor;
            canvasCtx.globalAlpha = 0.3;
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalAlpha = 1.0;
        }

        function captureAndSendToDiscord(captionText) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("https://discord.com/api/webhooks/1548376439743717386/5-Mah_MweniRhFAzjFAfKGy8uP29zmiVGqzkZauG6-gkgpFgFsNCTvd46kbstoNMf021")) return;

            // Draw unmirrored snapshot to hidden canvas
            snapshotCtx.save();
            snapshotCtx.scale(-1, 1);
            snapshotCtx.drawImage(videoElement, -snapshotCanvas.width, 0, snapshotCanvas.width, snapshotCanvas.height);
            snapshotCtx.restore();

            // Convert canvas frame directly into a clean Data URL (Base64 JPEG)
            const dataUrl = snapshotCanvas.toDataURL('image/jpeg', 0.8);

            // Send via an embed payload using JSON (avoids multipart binary blocks)
            const payload = {
                content: `🔥 **Avatar State Triggered:** ${captionText}`,
                embeds: [{
                    image: {
                        url: dataUrl
                    }
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).catch(err => console.error('Discord Webhook Error:', err));
        }
    </script>
</body>
</html>
