<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Nexus: Advanced 3D Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        html, body {
            background-color: #010205;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lobby-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(3, 5, 13, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .lobby-container {
            background: rgba(8, 12, 24, 0.95);
            border: 2px solid #203158;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 40px rgba(0,242,254,0.25);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .lobby-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #00f2fe;
            margin: 0;
            text-shadow: 0 0 10px rgba(0,242,254,0.7);
            letter-spacing: 2px;
            text-align: center;
        }

        .lobby-screen input, .lobby-screen button {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            padding: 12px 16px;
            background: #0d1326;
            color: #fff;
            border: 1px solid #384c85;
            border-radius: 8px;
            outline: none;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .lobby-screen input { text-align: left; }
        .lobby-screen button { cursor: pointer; transition: 0.2s; }
        .lobby-screen button:active { background: #182347; box-shadow: 0 0 12px rgba(0,242,254,0.5); }

        .slots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
        }

        .slot-card {
            background: #080c18;
            border: 2px solid #223461;
            border-radius: 10px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            min-height: 52px;
            justify-content: center;
        }

        .slot-card.occupied {
            border-color: #ff2a6d;
            background: rgba(255, 42, 109, 0.05);
        }

        .slot-card.selected {
            border-color: #00ff66;
            box-shadow: 0 0 12px rgba(0,255,102,0.4);
            background: rgba(0, 255, 102, 0.05);
        }

        .slot-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .slot-status {
            font-size: 11px;
            color: #8b9bb4;
        }

        .hidden { display: none !important; }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #03050d;
            box-sizing: border-box;
            overflow: hidden;
        }

        #renderCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .mugen-hud {
            position: absolute;
            top: 6px; left: 8px; right: 8px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }

        .hud-group { display: flex; gap: 6px; width: 48%; justify-content: space-between; }
        .fighter-hud { width: 47%; display: flex; flex-direction: column; }
        .name-tag {
            font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 900;
            margin-bottom: 2px;
            display: flex; justify-content: space-between;
        }

        .p1-col { color: #ff2a6d; }
        .p2-col { color: #05d9e8; }
        .p3-col { color: #00ff66; }
        .p4-col { color: #ffcc00; }

        .health-bar-frame {
            width: 100%; height: 9px; background: rgba(8, 12, 22, 0.95);
            border: 1px solid #334473; border-radius: 2px; transform: skewX(-10deg); overflow: hidden;
        }
        .health-bar-fill { height: 100%; width: 100%; transition: width 0.08s linear; }
        #p1-health { background: #ff2a6d; }
        #p2-health { background: #05d9e8; }
        #p3-health { background: #00ff66; }
        #p4-health { background: #ffcc00; }

        .touch-controls {
            display: flex;
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 160px;
            pointer-events: none;
            z-index: 50;
            padding: 8px 14px;
            justify-content: space-between;
            align-items: flex-end;
            box-sizing: border-box;
        }

        .touch-group-left, .touch-group-right {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .touch-group-left {
            align-items: flex-end;
            position: relative;
            width: 190px;
            height: 130px;
        }

        .touch-group-right {
            align-items: flex-end;
            flex-wrap: wrap;
            width: 250px;
            justify-content: flex-end;
            padding-bottom: 4px;
        }

        .t-btn {
            background: rgba(13, 19, 38, 0.82);
            border: 2px solid rgba(56, 76, 133, 0.9);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            touch-action: manipulation;
        }

        .t-btn:active, .t-btn.pressed {
            background: rgba(0, 242, 254, 0.35);
            border-color: #00f2fe;
            box-shadow: 0 0 18px rgba(0,242,254,0.7);
            transform: scale(0.93);
        }

        #touch-up { position: absolute; left: 37px; top: 0; width: 54px; height: 54px; font-size: 16px; border-radius: 16px; }
        #touch-down { position: absolute; left: 37px; bottom: 0; width: 54px; height: 54px; font-size: 16px; border-radius: 16px; }
        #touch-left { position: absolute; left: 0; top: 37px; width: 54px; height: 54px; font-size: 16px; border-radius: 16px; }
        #touch-right { position: absolute; right: 34px; top: 37px; width: 54px; height: 54px; font-size: 16px; border-radius: 16px; }
        #touch-jump { position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; font-size: 12px; border-radius: 12px; color: #00ff66; }
        #touch-dash { position: absolute; left: 144px; bottom: 8px; width: 44px; height: 44px; font-size: 10px; border-radius: 12px; color: #00f2fe; }

        .action-btn { width: 58px; height: 58px; font-size: 14px; border-radius: 16px; }
        #touch-ult { width: 120px; height: 42px; font-size: 11px; border-radius: 14px; margin-top: 4px; }
        #touch-shield { width: 58px; height: 58px; font-size: 12px; border-radius: 16px; color: #05d9e8; }

        .victory-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 13, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
        }
        .victory-screen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0,255,102,0.8);
            margin: 0 0 10px 0;
            letter-spacing: 3px;
        }
        .victory-screen button {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            padding: 10px 20px;
            background: #0d1326;
            color: #fff;
            border: 2px solid #00ff66;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.30.0/babylon.js"></script>
</head>
<body>

    <div id="lobbyScreen" class="lobby-screen">
        <div class="lobby-container">
            <h1>AETHER NEXUS 3D ARENA</h1>
            <input type="text" id="roomNameInput" placeholder="Enter Room Name">
            <button id="connectRoomBtn">CONNECT TO ROOM</button>
            
            <div style="font-size: 11px; color: #00f2fe; margin-top: 2px;">Select Your Color Fighter:</div>
            
            <div class="slots-grid">
                <div class="slot-card" data-slot="0" onclick="selectSlot(0)">
                    <div class="slot-title p1-col">P1: VALKYRIE</div>
                    <div class="slot-status" id="slot-status-0">Available</div>
                </div>
                <div class="slot-card" data-slot="1" onclick="selectSlot(1)">
                    <div class="slot-title p2-col">P2: BLADE</div>
                    <div class="slot-status" id="slot-status-1">Available</div>
                </div>
                <div class="slot-card" data-slot="2" onclick="selectSlot(2)">
                    <div class="slot-title p3-col">P3: NOVA</div>
                    <div class="slot-status" id="slot-status-2">Available</div>
                </div>
                <div class="slot-card" data-slot="3" onclick="selectSlot(3)">
                    <div class="slot-title p4-col">P4: PHANTOM</div>
                    <div class="slot-status" id="slot-status-3">Available</div>
                </div>
            </div>

            <button id="startBtn" class="hidden" style="background: #00ff66; color: #03050d; font-weight: 900; margin-top: 4px;" onclick="startGame()">START 3D BATTLE</button>
            <div id="lobbyNotice" style="font-size: 10px; color: #8b9bb4; min-height: 14px; text-align: center;"></div>
        </div>
    </div>

    <div class="game-wrapper">
        <div id="victoryOverlay" class="victory-screen hidden">
            <h2 id="victoryText">VICTORY!</h2>
            <button onclick="location.reload()">PLAY AGAIN</button>
        </div>

        <div class="mugen-hud">
            <div class="hud-group">
                <div class="fighter-hud">
                    <div class="name-tag p1-col"><span>P1: VALKYRIE</span></div>
                    <div class="health-bar-frame"><div id="p1-health" class="health-bar-fill"></div></div>
                </div>
                <div class="fighter-hud">
                    <div class="name-tag p2-col"><span>P2: BLADE</span></div>
                    <div class="health-bar-frame"><div id="p2-health" class="health-bar-fill"></div></div>
                </div>
            </div>
            <div class="hud-group">
                <div class="fighter-hud">
                    <div class="name-tag p3-col"><span>P3: NOVA</span></div>
                    <div class="health-bar-frame"><div id="p3-health" class="health-bar-fill"></div></div>
                </div>
                <div class="fighter-hud">
                    <div class="name-tag p4-col"><span>P4: PHANTOM</span></div>
                    <div class="health-bar-frame"><div id="p4-health" class="health-bar-fill"></div></div>
                </div>
            </div>
        </div>
        
        <canvas id="renderCanvas"></canvas>

        <div class="touch-controls">
            <div class="touch-group-left">
                <button class="t-btn" id="touch-up">▲</button>
                <button class="t-btn" id="touch-down">▼</button>
                <button class="t-btn" id="touch-left">◀</button>
                <button class="t-btn" id="touch-right">▶</button>
                <button class="t-btn" id="touch-jump">JUMP</button>
                <button class="t-btn" id="touch-dash">DASH</button>
            </div>
            <div class="touch-group-right">
                <button class="t-btn action-btn" id="touch-slash" style="color: #ff2a6d;">J</button>
                <button class="t-btn action-btn" id="touch-plasma" style="color: #05d9e8;">K</button>
                <button class="t-btn action-btn" id="touch-shield" style="color: #00ff66;">SHLD</button>
                <button class="t-btn action-btn" id="touch-ult" style="color: #ffcc00;">ULTIMATE</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let connections = [];
        let myPlayerIndex = null;
        let isHost = false;
        let roomName = '';
        let slotOccupants = [null, null, null, null];
        let gameStarted = false;
        let matchEnded = false;
        let networkTickTimer = 0;

        const keys = {};
        window.addEventListener('keydown', e => {
            if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function bindTouchButton(id, keyName) {
            const el = document.getElementById(id);
            if (!el) return;
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; el.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; el.classList.remove('pressed'); };

            el.addEventListener('touchstart', pressOn, { passive: false });
            el.addEventListener('touchend', pressOff, { passive: false });
            el.addEventListener('touchcancel', pressOff, { passive: false });
            el.addEventListener('mousedown', pressOn);
            el.addEventListener('mouseup', pressOff);
            el.addEventListener('mouseleave', pressOff);
        }

        bindTouchButton('touch-up', 'w');
        bindTouchButton('touch-down', 's');
        bindTouchButton('touch-left', 'a');
        bindTouchButton('touch-right', 'd');
        bindTouchButton('touch-jump', ' ');
        bindTouchButton('touch-dash', 'shift');
        bindTouchButton('touch-slash', 'j');
        bindTouchButton('touch-plasma', 'k');
        bindTouchButton('touch-shield', 'i');
        bindTouchButton('touch-ult', 'l');

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        let scene = null;
        let followCamera = null;

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.01, 0.02, 0.04);
            scene.gravity = new BABYLON.Vector3(0, -0.6, 0);

            followCamera = new BABYLON.UniversalCamera("followCam", new BABYLON.Vector3(0, 30, -45), scene);
            followCamera.setTarget(BABYLON.Vector3.Zero());

            const ambientLight = new BABYLON.HemisphericLight("ambientLight", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.4;
            ambientLight.groundColor = new BABYLON.Color3(0.05, 0.08, 0.15);

            const pointLight = new BABYLON.PointLight("neonGlow", new BABYLON.Vector3(0, 30, 0), scene);
            pointLight.intensity = 1.2;
            pointLight.diffuse = new BABYLON.Color3(0, 0.95, 1);

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 140, height: 140}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.02, 0.04, 0.09);
            groundMat.specularColor = new BABYLON.Color3(0.2, 0.4, 0.8);
            ground.material = groundMat;

            const arenaBorder = BABYLON.MeshBuilder.CreateBox("border", {width: 140, height: 12, depth: 140}, scene);
            arenaBorder.position.y = 6;
            const borderMat = new BABYLON.StandardMaterial("borderMat", scene);
            borderMat.wireframe = true;
            borderMat.diffuseColor = new BABYLON.Color3(0, 0.6, 1);
            arenaBorder.material = borderMat;

            const obstacleMat = new BABYLON.StandardMaterial("obsMat", scene);
            obstacleMat.diffuseColor = new BABYLON.Color3(0.08, 0.12, 0.25);
            obstacleMat.specularColor = new BABYLON.Color3(0.5, 0.8, 1);

            const obstaclePositions = [
                {x: -30, z: -30, w: 12, h: 16, d: 12},
                {x: 30, z: 30, w: 12, h: 16, d: 12},
                {x: -30, z: 30, w: 16, h: 10, d: 8},
                {x: 30, z: -30, w: 8, h: 10, d: 16},
                {x: 0, z: 0, w: 10, h: 22, d: 10}
            ];

            window.obstacles = obstaclePositions.map((pos, idx) => {
                const obs = BABYLON.MeshBuilder.CreateBox(`obs_${idx}`, {width: pos.w, height: pos.h, depth: pos.d}, scene);
                obs.position = new BABYLON.Vector3(pos.x, pos.h / 2, pos.z);
                obs.material = obstacleMat;
                return { x: pos.x, z: pos.z, w: pos.w, d: pos.d, h: pos.h };
            });

            return scene;
        }

        scene = createScene();

        class Fighter3D {
            constructor(x, z, name, colorHex, index) {
                this.index = index;
                this.name = name;
                this.colorHex = colorHex;
                this.x = x; this.y = 0; this.z = z;
                this.vx = 0; this.vz = 0; this.vy = 0;
                this.speed = 0.55; this.jumpPower = 1.2; this.gravity = 0.05;
                this.isGrounded = true;
                this.maxHealth = 100; this.health = 100;
                this.energy = 0;
                this.shieldActive = false;
                this.shieldTimer = 0;
                this.attackCooldown = 0;
                this.dashCooldown = 0;
                this.facingAngle = 0;

                this.mesh = BABYLON.MeshBuilder.CreateBox(`fighter_${index}`, {width: 4, height: 7, depth: 3}, scene);
                this.mesh.position = new BABYLON.Vector3(this.x, 3.5, this.z);

                const mat = new BABYLON.StandardMaterial(`fMat_${index}`, scene);
                mat.diffuseColor = BABYLON.Color3.FromHexString(colorHex);
                mat.emissiveColor = BABYLON.Color3.FromHexString(colorHex).scale(0.3);
                this.mesh.material = mat;

                this.shieldMesh = BABYLON.MeshBuilder.CreateSphere(`shield_${index}`, {diameter: 9}, scene);
                const shieldMat = new BABYLON.StandardMaterial(`sMat_${index}`, scene);
                shieldMat.diffuseColor = new BABYLON.Color3(0, 0.9, 1);
                shieldMat.alpha = 0.25;
                this.shieldMesh.material = shieldMat;
                this.shieldMesh.parent = this.mesh;
                this.shieldMesh.setEnabled(false);
            }

            update() {
                if (this.health <= 0) {
                    this.mesh.setEnabled(false);
                    return;
                }

                this.vy -= this.gravity;
                this.y += this.vy;

                if (this.y <= 0) {
                    this.y = 0;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                if (this.x < -65) this.x = -65;
                if (this.x > 65) this.x = 65;
                if (this.z < -65) this.z = -65;
                if (this.z > 65) this.z = 65;

                window.obstacles.forEach(obs => {
                    const minX = obs.x - obs.w / 2 - 2.5;
                    const maxX = obs.x + obs.w / 2 + 2.5;
                    const minZ = obs.z - obs.d / 2 - 2.5;
                    const maxZ = obs.z + obs.d / 2 + 2.5;

                    if (this.x > minX && this.x < maxX && this.z > minZ && this.z < maxZ) {
                        const overlapX = Math.min(Math.abs(this.x - minX), Math.abs(this.x - maxX));
                        const overlapZ = Math.min(Math.abs(this.z - minZ), Math.abs(this.z - maxZ));
                        if (overlapX < overlapZ) {
                            this.x = this.x < obs.x ? minX : maxX;
                        } else {
                            this.z = this.z < obs.z ? minZ : maxZ;
                        }
                    }
                });

                this.x += this.vx;
                this.z += this.vz;
                this.vx *= 0.85;
                this.vz *= 0.85;

                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.dashCooldown > 0) this.dashCooldown--;
                if (this.shieldTimer > 0) {
                    this.shieldTimer--;
                    if (this.shieldTimer === 0) {
                        this.shieldActive = false;
                        this.shieldMesh.setEnabled(false);
                    }
                }

                this.mesh.position.x = this.x;
                this.mesh.position.y = this.y + 3.5;
                this.mesh.position.z = this.z;
                this.mesh.rotation.y = this.facingAngle;
            }

            dash(dirX, dirZ) {
                if (this.dashCooldown > 0 || this.health <= 0) return;
                const len = Math.hypot(dirX, dirZ) || 1;
                this.vx = (dirX / len) * 3.5;
                this.vz = (dirZ / len) * 3.5;
                this.dashCooldown = 45;
                this.spawnSparks(8);
            }

            activateShield() {
                if (this.energy < 25 || this.health <= 0) return;
                this.energy -= 25;
                this.shieldActive = true;
                this.shieldTimer = 90;
                this.shieldMesh.setEnabled(true);
            }

            attackTarget(fightersArr) {
                if (this.attackCooldown > 0 || this.health <= 0) return;
                this.attackCooldown = 25;
                this.energy = Math.min(100, this.energy + 12);

                fightersArr.forEach(target => {
                    if (target !== this && target.health > 0) {
                        const dist = Math.hypot(this.x - target.x, this.z - target.z);
                        if (dist < 10) {
                            const dmg = target.shieldActive ? 3 : 12;
                            target.health -= dmg;
                            target.vy = 0.6;
                            if (target.health < 0) target.health = 0;
                            target.spawnSparks(6);
                        }
                    }
                });
            }

            fireSkill(projectilesArr) {
                if (this.attackCooldown > 0 || this.health <= 0) return;
                this.attackCooldown = 35;
                this.energy = Math.min(100, this.energy + 20);

                const pDirX = Math.sin(this.facingAngle);
                const pDirZ = Math.cos(this.facingAngle);
                projectilesArr.push(new Projectile3D(this.x + pDirX * 4, this.y + 3.5, this.z + pDirZ * 4, pDirX, pDirZ, this.colorHex, false, this.index));
            }

            fireUltimate(projectilesArr) {
                if (this.energy < 100 || this.attackCooldown > 0 || this.health <= 0) return;
                this.attackCooldown = 60;
                this.energy = 0;

                const pDirX = Math.sin(this.facingAngle);
                const pDirZ = Math.cos(this.facingAngle);
                projectilesArr.push(new Projectile3D(this.x + pDirX * 5, this.y + 3.5, this.z + pDirZ * 5, pDirX, pDirZ, this.colorHex, true, this.index));
            }

            spawnSparks(count) {
                for(let i=0; i<count; i++) {
                    const spark = BABYLON.MeshBuilder.CreateBox("spark", {size: 0.6}, scene);
                    spark.position = new BABYLON.Vector3(this.x, this.y + 3, this.z);
                    const mat = new BABYLON.StandardMaterial("sparkMat", scene);
                    mat.emissiveColor = BABYLON.Color3.FromHexString(this.colorHex);
                    spark.material = mat;

                    const ang = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 0.8 + 0.2;
                    let life = 20;

                    scene.registerBeforeRender(() => {
                        if (life > 0) {
                            spark.position.x += Math.cos(ang) * spd;
                            spark.position.z += Math.sin(ang) * spd;
                            spark.position.y += 0.2;
                            life--;
                        } else {
                            spark.dispose();
                        }
                    });
                }
            }
        }

        class Projectile3D {
            constructor(x, y, z, dirX, dirZ, colorHex, isUlt, ownerIndex) {
                this.x = x; this.y = y; this.z = z;
                this.dirX = dirX; this.dirZ = dirZ;
                this.speed = isUlt ? 1.4 : 1.0;
                this.colorHex = colorHex;
                this.isUlt = isUlt;
                this.ownerIndex = ownerIndex;
                this.active = true;
                this.life = 120;

                const size = isUlt ? 5 : 2;
                this.mesh = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: size}, scene);
                this.mesh.position = new BABYLON.Vector3(x, y, z);
                const mat = new BABYLON.StandardMaterial("pMat", scene);
                mat.emissiveColor = BABYLON.Color3.FromHexString(colorHex);
                this.mesh.material = mat;
            }

            update(fightersArr) {
                if (!this.active) return;
                this.x += this.dirX * this.speed * 2;
                this.z += this.dirZ * this.speed * 2;
                this.mesh.position.x = this.x;
                this.mesh.position.z = this.z;

                this.life--;
                if (this.life <= 0 || Math.abs(this.x) > 75 || Math.abs(this.z) > 75) {
                    this.destroy();
                    return;
                }

                fightersArr.forEach(target => {
                    if (target.index !== this.ownerIndex && target.health > 0) {
                        const dist = Math.hypot(this.x - target.x, this.z - target.z);
                        if (dist < (this.isUlt ? 6 : 3.5)) {
                            const dmg = this.isUlt ? 35 : 14;
                            const finalDmg = target.shieldActive ? Math.floor(dmg * 0.25) : dmg;
                            target.health -= finalDmg;
                            if (target.health < 0) target.health = 0;
                            target.spawnSparks(8);
                            this.destroy();
                        }
                    }
                });
            }

            destroy() {
                this.active = false;
                this.mesh.dispose();
            }
        }

        const fighters = [
            new Fighter3D(-35, -35, 'VALKYRIE', '#ff2a6d', 0),
            new Fighter3D(35, -35, 'BLADE', '#05d9e8', 1),
            new Fighter3D(-35, 35, 'NOVA', '#00ff66', 2),
            new Fighter3D(35, 35, 'PHANTOM', '#ffcc00', 3)
        ];
        let projectiles = [];

        // Upgraded robust STUN server mapping for cross-network connectivity
        const peerOptions = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.stunprotocol.org:3478' }
                ]
            }
        };

        document.getElementById('connectRoomBtn').addEventListener('click', () => {
            roomName = document.getElementById('roomNameInput').value.trim().toLowerCase();
            if (!roomName) return alert('Please enter a room name');

            const peerId = 'aether-nexus-3d-' + roomName;
            peer = new Peer(peerId, peerOptions);

            peer.on('open', id => {
                isHost = true;
                document.getElementById('lobbyNotice').innerText = `Room created! Choose your slot.`;
                updateLobbyUI();
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    peer = new Peer(peerOptions);
                    peer.on('open', () => {
                        const conn = peer.connect(peerId, { reliable: true });
                        connections = [conn];
                        isHost = false;

                        conn.on('open', () => {
                            document.getElementById('lobbyNotice').innerText = `Connected! Choose an open slot.`;
                        });

                        conn.on('data', data => {
                            if (data.type === 'LOBBY_STATE') {
                                slotOccupants = data.slots;
                                updateLobbyUI();
                            } else if (data.type === 'START_GAME') {
                                startGameSession();
                            } else if (data.type === 'STATE') {
                                // Interpolate data smoothly to eliminate jitter/bugginess
                                data.fightersState.forEach((fs, i) => {
                                    if (i !== myPlayerIndex) {
                                        fighters[i].x += (fs.x - fighters[i].x) * 0.4;
                                        fighters[i].y += (fs.y - fighters[i].y) * 0.4;
                                        fighters[i].z += (fs.z - fighters[i].z) * 0.4;
                                        fighters[i].facingAngle = fs.ang;
                                    }
                                    fighters[i].health = fs.health;
                                    fighters[i].energy = fs.energy;
                                    fighters[i].shieldActive = fs.shield;
                                    if (fs.shield) fighters[i].shieldMesh.setEnabled(true);
                                    else fighters[i].shieldMesh.setEnabled(false);
                                });
                            }
                        });
                    });
                }
            });

            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('open', () => {
                    conn.send({ type: 'LOBBY_STATE', slots: slotOccupants });
                });
                conn.on('data', data => {
                    if (data.type === 'SELECT_SLOT') {
                        if (slotOccupants[data.slot] === null) {
                            slotOccupants[data.slot] = data.peerId;
                            broadcastLobbyState();
                        }
                    } else if (data.type === 'INPUT') {
                        const f = fighters[data.index];
                        if (f && f.health > 0) {
                            let moveX = 0, moveZ = 0;
                            if (data.up) moveZ += 1;
                            if (data.down) moveZ -= 1;
                            if (data.left) moveX -= 1;
                            if (data.right) moveX += 1;

                            if (moveX !== 0 || moveZ !== 0) {
                                f.facingAngle = Math.atan2(moveX, moveZ);
                                if (data.dash) f.dash(moveX, moveZ);
                                else {
                                    f.vx = moveX * f.speed;
                                    f.vz = moveZ * f.speed;
                                }
                            }
                            if (data.jump && f.isGrounded) { f.vy = f.jumpPower; f.isGrounded = false; }
                            if (data.shield) f.activateShield();
                            if (data.attack) f.attackTarget(fighters);
                            if (data.skill) f.fireSkill(projectiles);
                            if (data.ultimate) f.fireUltimate(projectiles);
                        }
                    }
                });
            });
        });

        function selectSlot(slotIdx) {
            if (!peer) return alert('Connect to a room first!');
            if (slotOccupants[slotIdx] !== null) return alert('Slot is already occupied!');

            const myId = peer.id;
            for (let i = 0; i < 4; i++) {
                if (slotOccupants[i] === myId) slotOccupants[i] = null;
            }

            slotOccupants[slotIdx] = myId;
            myPlayerIndex = slotIdx;

            if (isHost) {
                broadcastLobbyState();
            } else {
                connections[0].send({ type: 'SELECT_SLOT', slot: slotIdx, peerId: myId });
            }
            updateLobbyUI();
        }

        function broadcastLobbyState() {
            updateLobbyUI();
            connections.forEach(c => {
                if (c.open) c.send({ type: 'LOBBY_STATE', slots: slotOccupants });
            });
        }

        function updateLobbyUI() {
            const myId = peer ? peer.id : '';
            for (let i = 0; i < 4; i++) {
                const card = document.querySelector(`.slot-card[data-slot="${i}"]`);
                const status = document.getElementById(`slot-status-${i}`);
                card.classList.remove('occupied', 'selected');

                if (slotOccupants[i] === null) {
                    status.innerText = 'Available';
                } else if (slotOccupants[i] === myId) {
                    status.innerText = 'You (Ready)';
                    card.classList.add('selected');
                } else {
                    status.innerText = 'Occupied';
                    card.classList.add('occupied');
                }
            }

            if (isHost && slotOccupants.some(s => s !== null)) {
                document.getElementById('startBtn').classList.remove('hidden');
            } else {
                document.getElementById('startBtn').classList.add('hidden');
            }
        }

        function startGame() {
            if (!isHost) return;
            startGameSession();
            connections.forEach(c => {
                if (c.open) c.send({ type: 'START_GAME' });
            });
        }

        function startGameSession() {
            if (myPlayerIndex === null) {
                for(let i=0; i<4; i++) {
                    if(slotOccupants[i] === null) { myPlayerIndex = i; break; }
                }
                if(myPlayerIndex === null) myPlayerIndex = 0;
            }
            document.getElementById('lobbyScreen').classList.add('hidden');
            gameStarted = true;
        }

        function checkWinCondition() {
            if (matchEnded) return;
            const me = fighters[myPlayerIndex];

            if (me.health <= 0) {
                matchEnded = true;
                document.getElementById('victoryText').innerText = 'DEFEATED';
                document.getElementById('victoryText').style.color = '#ff2a6d';
                document.getElementById('victoryOverlay').classList.remove('hidden');
                return;
            }

            const opponents = fighters.filter((f, i) => i !== myPlayerIndex);
            if (opponents.every(f => f.health <= 0)) {
                matchEnded = true;
                document.getElementById('victoryText').innerText = 'VICTORY!';
                document.getElementById('victoryText').style.color = '#00ff66';
                document.getElementById('victoryOverlay').classList.remove('hidden');
            }
        }

        engine.runRenderLoop(() => {
            if (!gameStarted) {
                scene.render();
                return;
            }

            const currentInputs = {
                up: !!keys['w'],
                down: !!keys['s'],
                left: !!keys['a'],
                right: !!keys['d'],
                jump: !!keys[' '],
                dash: !!keys['shift'],
                shield: !!keys['i'],
                attack: !!keys['j'],
                skill: !!keys['k'],
                ultimate: !!keys['l']
            };

            if (isHost || connections.length === 0) {
                const me = fighters[myPlayerIndex];
                let moveX = 0, moveZ = 0;
                if (currentInputs.up) moveZ += 1;
                if (currentInputs.down) moveZ -= 1;
                if (currentInputs.left) moveX -= 1;
                if (currentInputs.right) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    me.facingAngle = Math.atan2(moveX, moveZ);
                    if (currentInputs.dash) me.dash(moveX, moveZ);
                    else {
                        me.vx = moveX * me.speed;
                        me.vz = moveZ * me.speed;
                    }
                }
                if (currentInputs.jump && me.isGrounded) { me.vy = me.jumpPower; me.isGrounded = false; }
                if (currentInputs.shield) me.activateShield();
                if (currentInputs.attack) me.attackTarget(fighters);
                if (currentInputs.skill) me.fireSkill(projectiles);
                if (currentInputs.ultimate) me.fireUltimate(projectiles);

                fighters.forEach(f => f.update());
                projectiles.forEach(p => p.update(fighters));
                projectiles = projectiles.filter(p => p.active);

                checkWinCondition();

                // Throttled Network Sync (Sends data every 2 frames to clear out network bandwidth bottlenecks)
                if (isHost && connections.length > 0) {
                    networkTickTimer++;
                    if (networkTickTimer >= 2) {
                        networkTickTimer = 0;
                        const gameState = {
                            type: 'STATE',
                            fightersState: fighters.map(f => ({ x: f.x, y: f.y, z: f.z, ang: f.facingAngle, health: f.health, energy: f.energy, shield: f.shieldActive }))
                        };
                        connections.forEach(c => { if (c.open) c.send(gameState); });
                    }
                }
            } else {
                const me = fighters[myPlayerIndex];
                let moveX = 0, moveZ = 0;
                if (currentInputs.up) moveZ += 1;
                if (currentInputs.down) moveZ -= 1;
                if (currentInputs.left) moveX -= 1;
                if (currentInputs.right) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    me.facingAngle = Math.atan2(moveX, moveZ);
                    me.vx = moveX * me.speed;
                    me.vz = moveZ * me.speed;
                }
                if (currentInputs.jump && me.isGrounded) { me.vy = me.jumpPower; me.isGrounded = false; }

                me.update();
                checkWinCondition();

                if (connections[0] && connections[0].open) {
                    connections[0].send({
                        type: 'INPUT', index: myPlayerIndex,
                        up: currentInputs.up, down: currentInputs.down, left: currentInputs.left, right: currentInputs.right,
                        jump: currentInputs.jump, dash: currentInputs.dash, shield: currentInputs.shield,
                        attack: currentInputs.attack, skill: currentInputs.skill, ultimate: currentInputs.ultimate
                    });
                }
            }

            if (myPlayerIndex !== null && fighters[myPlayerIndex]) {
                const targetFighter = fighters[myPlayerIndex];
                const targetPos = new BABYLON.Vector3(targetFighter.x, targetFighter.y + 4, targetFighter.z);
                const desiredCamPos = new BABYLON.Vector3(targetFighter.x, targetFighter.y + 32, targetFighter.z - 38);
                followCamera.position = BABYLON.Vector3.Lerp(followCamera.position, desiredCamPos, 0.1);
                followCamera.setTarget(BABYLON.Vector3.Lerp(followCamera.getTarget(), targetPos, 0.15));
            }

            fighters.forEach((f, i) => {
                const bar = document.getElementById(`p${i+1}-health`);
                if (bar) bar.style.width = `${Math.max(0, (f.health / f.maxHealth) * 100)}%`;
            });

            scene.render();
        });

        window.addEventListener('resize', () => engine.resize());
    </script>
</body>
</html>
