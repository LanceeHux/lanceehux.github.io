<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Recognition Arena</title>
    <!-- Load MediaPipe Hands and Camera Utils via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        body {
            background-color: #03050a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.2);
            border: 3px solid #1a233a;
            border-radius: 14px;
            overflow: hidden;
            background: #080c18;
            width: 720px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: none; /* Processed via hidden video element */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror camera feed */
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 14, 26, 0.85);
            border: 2px solid #28355c;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        #detectedGesture {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
        }

        .instructions {
            margin-top: 15px;
            font-size: 1rem;
            color: #8b9bb4;
            background: rgba(14, 20, 38, 0.8);
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid #1f2b4d;
            letter-spacing: 1px;
            text-align: center;
        }

        .instructions span {
            color: #05d9e8;
            font-family: 'Orbitron', sans-serif;
        }

        /* Permission Modal */
        #permissionScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #permissionScreen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #05d9e8;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #05d9e8;
        }

        #permissionScreen p {
            color: #8b9bb4;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Permission & Start Screen -->
        <div id="permissionScreen">
            <h2>CAMERA ACCESS REQUIRED</h2>
            <p>This application uses computer vision to detect your hand gestures in real-time. Please grant camera permissions to begin.</p>
            <button class="btn" onclick="requestCameraAccess()">INITIALIZE CAMERA</button>
        </div>

        <div class="hud-overlay">
            <div class="badge">STATUS: <span id="detectedGesture">SEARCHING...</span></div>
            <div class="badge" id="actionCounter">SCORE: 0</div>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="outputCanvas" width="720" height="480"></canvas>
    </div>

    <div class="instructions">
        Show a <span>Peace Sign (✌️)</span> for Function A &nbsp;|&nbsp; Show a <span>High Five / Open Palm (🖐️)</span> for Function B
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusSpan = document.getElementById('detectedGesture');
        const counterSpan = document.getElementById('actionCounter');
        const permissionScreen = document.getElementById('permissionScreen');

        let score = 0;
        let lastTriggerTime = 0;

        async function requestCameraAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 720, height: 480 } });
                videoElement.srcObject = stream;
                permissionScreen.style.display = 'none';
                
                // Initialize MediaPipe Hands after permission granted
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onHandResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 720,
                    height: 480
                });
                camera.start();

            } catch (err) {
                alert('Camera permission denied or unavailable. Please check your browser settings.');
                console.error(err);
            }
        }

        // --- GESTURE RECOGNITION LOGIC ---
        function onHandResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Draw skeleton landmarks on canvas for aesthetic cyberpunk interface
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#05d9e8', lineWidth: 3 });
                drawLandmarks(canvasCtx, landmarks, { color: '#ff2a6d', lineWidth: 1, radius: 4 });

                // Analyze gesture state
                const gesture = classifyGesture(landmarks);
                statusSpan.innerText = gesture.name;

                const now = Date.now();
                // Cooldown to avoid rapid spamming (1.5 seconds)
                if (now - lastTriggerTime > 1500) {
                    if (gesture.type === 'PIECE') {
                        triggerFunctionA();
                        lastTriggerTime = now;
                    } else if (gesture.type === 'HIGH_FIVE') {
                        triggerFunctionB();
                        lastTriggerTime = now;
                    }
                }
            } else {
                statusSpan.innerText = 'NO HAND DETECTED';
            }
            canvasCtx.restore();
        }

        function classifyGesture(lm) {
            // Finger tip indices: Index=8, Middle=12, Ring=16, Pinky=20
            // Finger mcp/pip joint checks for curl state (y-axis coordinate comparison)
            const isIndexUp = lm[8].y < lm[6].y;
            const isMiddleUp = lm[12].y < lm[10].y;
            const isRingUp = lm[16].y < lm[14].y;
            const isPinkyUp = lm[20].y < lm[18].y;

            // 1. Piece Sign: Index & Middle up, Ring & Pinky curled down
            if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) {
                return { name: 'PEECE SIGN (✌️)', type: 'PIECE' };
            }

            // 2. High Five / Open Palm: All 4 main fingers extended up
            if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp) {
                return { name: 'HIGH FIVE (🖐️)', type: 'HIGH_FIVE' };
            }

            return { name: 'UNKNOWN GESTURE', type: 'NONE' };
        }

        // --- TWO DIFFERENT FUNCTIONS ---
        function triggerFunctionA() {
            score += 10;
            counterSpan.innerText = `SCORE: ${score}`;
            statusSpan.style.color = '#00c6ff';
            console.log("Function A Triggered: Peace Sign executed!");
            
            // Visual feedback flash on canvas
            canvasCtx.fillStyle = 'rgba(0, 198, 255, 0.3)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }

        function triggerFunctionB() {
            score += 25;
            counterSpan.innerText = `SCORE: ${score}`;
            statusSpan.style.color = '#ff2a6d';
            console.log("Function B Triggered: High Five executed!");

            // Visual feedback flash on canvas
            canvasCtx.fillStyle = 'rgba(255, 42, 109, 0.3)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
    </script>
</body>
</html>
