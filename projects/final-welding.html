<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcForge 2D - Dynamic Industrial Welding Simulator</title>
    <!-- Removed Tailwind CDN for complete offline functionality -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #090d16;
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .font-tech {
            font-family: 'Chakra Petch', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .hud-border {
            border-bottom: 2px solid #f59e0b;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* Responsive Layout Utility Classes */
        .app-container {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hud-top-bar {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            right: 0.5rem;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .hud-top-bar {
                top: 1rem;
                left: 1rem;
                right: 1rem;
                flex-wrap: nowrap;
            }
        }

        .hud-title-panel {
            padding: 0.375rem 0.75rem;
            border-radius: 0.75rem;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            .hud-title-panel {
                padding: 0.75rem 1.25rem;
                gap: 1rem;
            }
        }

        .hud-icon-box {
            background-color: rgba(245, 158, 11, 0.2);
            padding: 0.375rem;
            border-radius: 0.5rem;
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-title-text {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fbbf24;
            text-transform: uppercase;
        }

        @media (min-width: 640px) {
            .hud-title-text { font-size: 1.125rem; }
        }

        .hud-subtitle-text {
            font-size: 0.5625rem;
            color: #94a3b8;
            font-family: monospace;
        }

        @media (min-width: 640px) {
            .hud-subtitle-text { font-size: 0.75rem; }
        }

        .hud-controls-panel {
            padding: 0.375rem;
            border-radius: 0.75rem;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            overflow-x: auto;
            max-width: 100%;
        }

        .btn-action {
            padding: 0.375rem 0.625rem;
            border-radius: 0.5rem;
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.15s ease;
            white-space: nowrap;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 640px) {
            .btn-action {
                padding: 0.375rem 0.875rem;
                font-size: 0.75rem;
            }
        }

        .btn-active {
            background-color: #f59e0b;
            color: #020617;
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);
        }

        .btn-inactive {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .btn-inactive:hover {
            color: #fbbf24;
            border-color: #f59e0b;
        }

        .btn-icon {
            padding: 0.375rem;
            border-radius: 0.5rem;
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            cursor: pointer;
            transition: color 0.15s;
        }

        .btn-icon:hover { color: #fbbf24; }
        .btn-icon.danger:hover { color: #f43f5e; }

        .divider-v {
            height: 1.25rem;
            width: 1px;
            background-color: #334155;
            margin: 0 0.125rem;
            flex-shrink: 0;
        }

        /* Palette Side Panel Styles */
        .side-container {
            position: absolute;
            left: 0.5rem;
            top: 4rem;
            z-index: 20;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        @media (min-width: 640px) {
            .side-container {
                left: 1rem;
                top: 5.5rem;
            }
        }

        .side-panel {
            width: 10rem;
            border-radius: 0.75rem;
            padding: 0.5rem;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        @media (min-width: 640px) {
            .side-panel {
                width: 15rem;
                padding: 1rem;
                max-height: calc(100vh - 160px);
            }
        }

        .spawner-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.375rem;
        }

        @media (min-width: 640px) {
            .spawner-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
        }

        .spawner-card {
            padding: 0.375rem 0.5rem;
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 0.5rem;
            text-align: left;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .spawner-card:hover {
            border-color: #f59e0b;
            background-color: rgba(245, 158, 11, 0.15);
        }

        .spawner-title {
            color: #fbbf24;
            font-size: 0.625rem;
            font-weight: 700;
        }

        @media (min-width: 640px) {
            .spawner-title { font-size: 0.75rem; }
        }

        .spawner-desc {
            font-size: 0.5625rem;
            color: #94a3b8;
        }

        /* Bottom Gauge Overlay */
        .bottom-hud {
            position: absolute;
            bottom: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 95%;
            max-width: 36rem;
            border-radius: 0.75rem;
            padding: 0.5rem 0.75rem;
            pointer-events: auto;
        }

        @media (min-width: 640px) {
            .bottom-hud {
                bottom: 1.5rem;
                padding: 0.75rem 1.25rem;
                border-radius: 1rem;
            }
        }

        .heat-gauge-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.625rem;
            border-top: 1px solid rgba(51, 65, 85, 0.8);
            padding-top: 0.375rem;
            margin-top: 0.375rem;
        }

        .heat-bar-outer {
            width: 7rem;
            background-color: #1e293b;
            height: 0.5rem;
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid #334155;
            margin: 0 0.5rem;
        }

        @media (min-width: 640px) {
            .heat-bar-outer { width: 12rem; }
        }

        .heat-bar-inner {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #f59e0b, #f43f5e);
            border-radius: 9999px;
            width: 0%;
            transition: width 75ms linear;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950">

    <!-- Canvas Container -->
    <div id="canvas-container" class="app-container"></div>

    <!-- HUD Overlay Top Bar -->
    <div class="hud-top-bar">
        <!-- Title & Status -->
        <div class="glass-panel hud-title-panel hud-border">
            <div class="hud-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>
            </div>
            <div>
                <h1 class="font-tech hud-title-text">ArcForge 2D</h1>
                <p id="current-project-title" class="hud-subtitle-text">MODE: Freeform</p>
            </div>
        </div>

        <!-- Mode & Controls -->
        <div class="glass-panel hud-controls-panel">
            <button id="btn-mode-assemble" class="btn-action btn-active font-tech">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg> Move
            </button>
            <button id="btn-rotate-part" class="btn-action btn-inactive font-tech" title="Rotate Selected Part">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; color: #fbbf24;"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Rotate
            </button>
            <button id="btn-mode-weld" class="btn-action btn-inactive font-tech">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Arc Weld
            </button>
            <div class="divider-v"></div>
            <button id="btn-audio" class="btn-icon" title="Toggle Sound">
                <svg id="icon-audio" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <button id="btn-clear" class="btn-icon danger" title="Clear Workshop">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    </div>

    <!-- Left Side: Parts Spawner Palette Toggle & Panel -->
    <div class="side-container">
        <button id="btn-toggle-palette" class="btn-action btn-inactive font-tech" style="margin-bottom: 0.5rem; display: flex;">
            Parts Stock <svg id="palette-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 6px;"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div id="side-palette-panel" class="glass-panel side-panel">
            <h2 class="font-tech" style="font-size: 0.625rem; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: flex; align-items: center;">
                Add Stock
            </h2>
            <div class="spawner-grid" id="parts-palette">
                <button onclick="spawnMetalPart('beam')" class="spawner-card">
                    <div class="spawner-title font-tech">Steel Beam</div>
                    <div class="spawner-desc">Long structural</div>
                </button>
                <button onclick="spawnMetalPart('plate')" class="spawner-card">
                    <div class="spawner-title font-tech">Metal Plate</div>
                    <div class="spawner-desc">Flat gusset</div>
                </button>
                <button onclick="spawnMetalPart('pipe')" class="spawner-card">
                    <div class="spawner-title font-tech">Hollow Pipe</div>
                    <div class="spawner-desc">Round tube</div>
                </button>
                <button onclick="spawnMetalPart('angle')" class="spawner-card">
                    <div class="spawner-title font-tech">Angle Iron</div>
                    <div class="spawner-desc">L-Bracket</div>
                </button>
            </div>

            <div style="margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #1e293b; font-size: 0.625rem; color: #94a3b8; font-family: monospace;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                    <span>Parts:</span>
                    <span id="stat-parts-count" style="color: #fbbf24; font-weight: bold;">0</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Welds:</span>
                    <span id="stat-welds-count" style="color: #fbbf24; font-weight: bold;">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom HUD -->
    <div class="glass-panel bottom-hud">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem; overflow: hidden;">
                <span id="instruction-badge" class="font-tech" style="padding: 0.125rem 0.375rem; border-radius: 0.25rem; background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.625rem; font-weight: 700; text-transform: uppercase;">Status</span>
                <span id="instruction-text" style="font-size: 0.625rem; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Spawn stock & drag into place!</span>
            </div>
        </div>
        <div id="heat-gauge-container" class="heat-gauge-wrap">
            <span style="color: #94a3b8; display: flex; align-items: center;">Heat:</span>
            <div class="heat-bar-outer">
                <div id="heat-bar" class="heat-bar-inner"></div>
            </div>
            <span id="heat-value" style="color: #cbd5e1; width: 2.5rem; text-align: right;">0°C</span>
        </div>
    </div>

    <script>
        // Core Canvas Setup
        let canvas, ctx;

        let activeMode = 'assemble'; // 'assemble' or 'weld'
        let audioMuted = false;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let selectedPart = null;

        let metalParts = [];
        let weldBeads = [];
        let sparkParticles = [];
        let torchHeat = 0;

        // Weld Group Helper: Find connected component of fused parts
        function getWeldedGroup(startPart) {
            const group = [startPart];
            const visited = new Set([startPart.id]);
            const queue = [startPart];

            while (queue.length > 0) {
                const current = queue.shift();
                
                // Find all parts connected to 'current' via weld beads
                for (const other of metalParts) {
                    if (visited.has(other.id)) continue;

                    // Check if there is a weld bead that explicitly joins 'current' and 'other'
                    const isConnected = weldBeads.some(b => {
                        return b.weldedPartIds && 
                               b.weldedPartIds.includes(current.id) && 
                               b.weldedPartIds.includes(other.id);
                    });

                    if (isConnected) {
                        visited.add(other.id);
                        group.push(other);
                        queue.push(other);
                    }
                }
            }
            return group;
        }

        // Convert stored local bead offset back to absolute world coordinates
        function getBeadWorldPos(bead) {
            const parent = metalParts.find(p => p.id === bead.partId);
            if (!parent) return { x: bead.localX, y: bead.localY };

            const cos = Math.cos(parent.rotation);
            const sin = Math.sin(parent.rotation);
            return {
                x: parent.x + (bead.localX * cos - bead.localY * sin),
                y: parent.y + (bead.localX * sin + bead.localY * cos)
            };
        }

        // Audio Context Setup for Welding Crackle Sound
        let audioCtx = null;
        let arcNoiseNode = null;
        let arcGainNode = null;

        function initCanvas() {
            canvas = document.createElement('canvas');
            ctx = canvas.getContext('2d');
            const container = document.getElementById('canvas-container');
            if (container) {
                container.appendChild(canvas);
            } else {
                document.body.appendChild(canvas);
            }
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                arcNoiseNode = audioCtx.createBufferSource();
                arcNoiseNode.buffer = noiseBuffer;
                arcNoiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 3.0;

                arcGainNode = audioCtx.createGain();
                arcGainNode.gain.value = 0;

                arcNoiseNode.connect(filter);
                filter.connect(arcGainNode);
                arcGainNode.connect(audioCtx.destination);
                arcNoiseNode.start();
            } catch (e) {}
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Metal Part Factory
        function spawnMetalPart(type) {
            const centerX = canvas.width / 2 + (Math.random() - 0.5) * 100;
            const centerY = canvas.height / 2 + (Math.random() - 0.5) * 100;
            let part = { id: Date.now() + Math.random(), type, x: centerX, y: centerY, rotation: 0, width: 140, height: 35 };

            if (type === 'plate') { part.width = 100; part.height = 100; }
            else if (type === 'pipe') { part.width = 160; part.height = 30; }
            else if (type === 'angle') { part.width = 120; part.height = 45; }

            metalParts.push(part);
            updateStatsUI();
        }

        function clearWorkshop() {
            metalParts = [];
            weldBeads = [];
            sparkParticles = [];
            updateStatsUI();
        }

        // Check if mouse hits part
        function isPointInPart(px, py, part) {
            const dx = px - part.x;
            const dy = py - part.y;
            const cos = Math.cos(-part.rotation);
            const sin = Math.sin(-part.rotation);
            const rx = dx * cos - dy * sin;
            const ry = dx * sin + dy * cos;
            return Math.abs(rx) <= part.width / 2 && Math.abs(ry) <= part.height / 2;
        }

        function setupListeners() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let groupDragOffsets = [];

            // Touch & Mouse Helper: Canvas Coordinates
            const getCanvasCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const handleStart = (e) => {
                isMouseDown = true;
                initAudio();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;

                if (activeMode === 'assemble') {
                    for (let i = metalParts.length - 1; i >= 0; i--) {
                        if (isPointInPart(mouseX, mouseY, metalParts[i])) {
                            selectedPart = metalParts[i];

                            // Get full welded assembly group
                            const weldedGroup = getWeldedGroup(selectedPart);

                            // Calculate offset for every part in the group
                            groupDragOffsets = weldedGroup.map(part => ({
                                part,
                                offsetX: coords.x - part.x,
                                offsetY: coords.y - part.y
                            }));

                            // Move selected part to top of layer render order
                            metalParts.splice(i, 1);
                            metalParts.push(selectedPart);
                            break;
                        }
                    }
                } else if (activeMode === 'weld') {
                    performWeldingAt(mouseX, mouseY);
                }
            };

            const handleMove = (e) => {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;

                if (isMouseDown) {
                    if (activeMode === 'assemble' && groupDragOffsets.length > 0) {
                        // Synchronous group movement
                        groupDragOffsets.forEach(item => {
                            item.part.x = coords.x - item.offsetX;
                            item.part.y = coords.y - item.offsetY;
                        });
                    } else if (activeMode === 'weld') {
                        performWeldingAt(mouseX, mouseY);
                    }
                }
            };

            const handleEnd = () => {
                isMouseDown = false;
                groupDragOffsets = [];
                if (arcGainNode) {
                    arcGainNode.gain.value = 0;
                }
            };

            // Canvas Mouse & Touch Event Listeners
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }, { passive: false });
            window.addEventListener('touchend', handleEnd);

            // UI Button Handlers
            document.getElementById('btn-mode-assemble').addEventListener('click', () => setMode('assemble'));
            document.getElementById('btn-mode-weld').addEventListener('click', () => setMode('weld'));

            document.getElementById('btn-rotate-part').addEventListener('click', () => {
                let target = selectedPart;
                if (!target && metalParts.length > 0) {
                    target = metalParts[metalParts.length - 1];
                }

                if (target) {
                    const group = getWeldedGroup(target);
                    const angleStep = Math.PI / 4; // 45 degree rotation step
                    const pivotX = target.x;
                    const pivotY = target.y;

                    group.forEach(p => {
                        const dx = p.x - pivotX;
                        const dy = p.y - pivotY;
                        const cos = Math.cos(angleStep);
                        const sin = Math.sin(angleStep);

                        p.x = pivotX + (dx * cos - dy * sin);
                        p.y = pivotY + (dx * sin + dy * cos);
                        p.rotation += angleStep;
                    });
                }
            });

            document.getElementById('btn-audio').addEventListener('click', () => {
                audioMuted = !audioMuted;
                const iconAudio = document.getElementById('icon-audio');
                if (audioMuted) {
                    iconAudio.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
                    iconAudio.style.color = '#f43f5e';
                } else {
                    iconAudio.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
                    iconAudio.style.color = 'currentColor';
                }
            });

            document.getElementById('btn-clear').addEventListener('click', clearWorkshop);

            // Mobile Palette Toggle Button Handler
            const paletteBtn = document.getElementById('btn-toggle-palette');
            const sidePanel = document.getElementById('side-palette-panel');
            const chevron = document.getElementById('palette-chevron');
            
            if (paletteBtn && sidePanel) {
                paletteBtn.addEventListener('click', () => {
                    sidePanel.classList.toggle('hidden');
                    if (chevron) {
                        if (sidePanel.classList.contains('hidden')) {
                            chevron.innerHTML = '<polyline points="18 15 12 9 6 15"/>';
                        } else {
                            chevron.innerHTML = '<polyline points="6 9 12 15 18 9"/>';
                        }
                    }
                });
            }

            // Initial default parts
            spawnMetalPart('beam');
            spawnMetalPart('beam');
            if (metalParts[1]) {
                metalParts[1].x += 80;
                metalParts[1].rotation = Math.PI / 2;
            }
        }

        function setMode(mode) {
            activeMode = mode;
            const btnAssemble = document.getElementById('btn-mode-assemble');
            const btnWeld = document.getElementById('btn-mode-weld');

            if (mode === 'assemble') {
                btnAssemble.className = "btn-action btn-active font-tech";
                btnWeld.className = "btn-action btn-inactive font-tech";
                document.getElementById('instruction-text').innerText = "Tap a part to select it, then tap the Rotate button or drag to reposition.";
            } else {
                btnWeld.className = "btn-action btn-active font-tech";
                btnAssemble.className = "btn-action btn-inactive font-tech";
                document.getElementById('instruction-text').innerText = "Drag welding gun tip across metal joint seams to bond them together!";
            }
        }

        function performWeldingAt(x, y) {
            // Find all metal parts intersecting the welding tip position
            const touchingParts = metalParts.filter(p => isPointInPart(x, y, p));

            if (touchingParts.length > 0) {
                // Primary parent part to anchor local coordinates
                const targetPart = touchingParts[touchingParts.length - 1];

                // Store bead in local coordinate space of the parent metal part
                const dx = x - targetPart.x;
                const dy = y - targetPart.y;
                const cos = Math.cos(-targetPart.rotation);
                const sin = Math.sin(-targetPart.rotation);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;

                weldBeads.push({
                    partId: targetPart.id,
                    weldedPartIds: touchingParts.map(p => p.id), // Store explicit IDs of all fused parts
                    localX,
                    localY,
                    radius: 6 + Math.random() * 4,
                    opacity: 1.0,
                    heat: 1.0
                });
            }

            // Generate sparks
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                sparkParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 1.0,
                    size: 1 + Math.random() * 2.5
                });
            }

            torchHeat = Math.min(100, torchHeat + 3);

            if (arcGainNode && !audioMuted) {
                arcGainNode.gain.value = 0.15 + Math.random() * 0.1;
            }
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('stat-parts-count').innerText = metalParts.length;
            document.getElementById('stat-welds-count').innerText = weldBeads.length;
        }

        function drawMetalTexture(part) {
            ctx.save();
            ctx.translate(part.x, part.y);
            ctx.rotate(part.rotation);

            const w = part.width;
            const h = part.height;

            // Outer Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            // Metallic Base Gradient
            const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
            grad.addColorStop(0, '#64748b');
            grad.addColorStop(0.3, '#94a3b8');
            grad.addColorStop(0.5, '#475569');
            grad.addColorStop(0.8, '#cbd5e1');
            grad.addColorStop(1, '#334155');

            ctx.fillStyle = grad;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;

            if (part.type === 'pipe') {
                ctx.beginPath();
                ctx.roundRect(-w/2, -h/2, w, h, h/2);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeRect(-w/2, -h/2, w, h);
            }

            // Internal Structural Lines
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1.5;

            if (part.type === 'beam') {
                ctx.strokeRect(-w/2 + 6, -h/2 + 4, w - 12, h - 8);
            } else if (part.type === 'angle') {
                ctx.beginPath();
                ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0);
                ctx.stroke();
            }

            // Highlight border if selected
            if (part === selectedPart && activeMode === 'assemble') {
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-w/2 - 3, -h/2 - 3, w + 6, h + 6);
            }

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Workshop Grid Surface
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Metal Parts
            metalParts.forEach(drawMetalTexture);

            // Draw Weld Beads (Heat & Cured Texture attached to parts)
            weldBeads.forEach(b => {
                const pos = getBeadWorldPos(b);

                ctx.save();
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, b.radius, 0, Math.PI * 2);

                if (b.heat > 0.05) {
                    // Hot Glowing Molten Core
                    ctx.fillStyle = `rgba(255, ${Math.floor(150 * b.heat)}, 0, ${b.opacity})`;
                    ctx.shadowColor = '#ff5500';
                    ctx.shadowBlur = 12 * b.heat;
                } else {
                    // Cured Nickel-Steel Metallic Weld Bead Texture
                    const bGrad = ctx.createRadialGradient(pos.x - 2, pos.y - 2, 1, pos.x, pos.y, b.radius);
                    bGrad.addColorStop(0, '#e2e8f0');
                    bGrad.addColorStop(0.5, '#64748b');
                    bGrad.addColorStop(1, '#1e293b');
                    ctx.fillStyle = bGrad;
                    ctx.shadowBlur = 0;
                }
                ctx.fill();

                // Outer Bead Rim Stitching
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();

                // Heat Decay
                if (b.heat > 0) b.heat -= 0.01;
            });

            // Draw Spark Particles
            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const p = sparkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 0.03;

                if (p.life <= 0) {
                    sparkParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.fillStyle = `rgba(255, ${Math.floor(200 * p.life)}, 50, ${p.life})`;
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Welding Gun Torch in Weld Mode
            if (activeMode === 'weld') {
                ctx.save();
                ctx.translate(mouseX, mouseY);

                // Torch Nozzle
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.moveTo(-10, 20); ctx.lineTo(10, 20); ctx.lineTo(4, 0); ctx.lineTo(-4, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Torch Tip Cone
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.lineTo(0, -10);
                ctx.closePath();
                ctx.fill();

                // Electric Arc Glow when firing
                if (isMouseDown) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.shadowColor = '#60a5fa';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(0, -10, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Heat Gauge Decay
            if (torchHeat > 0) torchHeat = Math.max(0, torchHeat - 0.4);
            document.getElementById('heat-bar').style.width = `${torchHeat}%`;
            document.getElementById('heat-value').innerText = `${Math.round(torchHeat * 15)}°C`;

            requestAnimationFrame(render);
        }

        window.onload = () => {
            initCanvas();
            setupListeners();
            render();
        };
    </script>
</body>
</html>
