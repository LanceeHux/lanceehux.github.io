        class SoundEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.2) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

        // --- LOW POLY ENVIRONMENT ---
        function buildEnvironment() {
            const grassGeo = new THREE.PlaneGeometry(120, 120);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.85 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.receiveShadow = true;
            scene.add(grass);

            createWell(new THREE.Vector3(14, 0, 4));
            createMarketKiosk(new THREE.Vector3(-14, 0, 4));

            for (let i = -45; i <= 45; i += 18) {
                if (Math.abs(i) > 8) {
                    createTree(new THREE.Vector3(i, 0, -42));
                    createTree(new THREE.Vector3(i, 0, 42));
                    createTree(new THREE.Vector3(-42, 0, i));
                    createTree(new THREE.Vector3(42, 0, i));
                }
            }
        }

        // --- FARM PLOT GRID SYSTEM ---
        function buildFarmGrid() {
            farmPlots.forEach(p => scene.remove(p.mesh));
            farmPlots = [];

            const totalPlots = 16;
            const gridSize = 4;
            const plotSpacing = 3.3;
            const startX = -((gridSize - 1) * plotSpacing) / 2;
            const startZ = -((gridSize - 1) * plotSpacing) / 2;

            for (let i = 0; i < totalPlots; i++) {
                const row = Math.floor(i / gridSize);
                const col = i % gridSize;
                const x = startX + col * plotSpacing;
                const z = startZ + row * plotSpacing;
                const isUnlocked = i < gameState.unlockedPlots;

                const plotMesh = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.2, 2.9), new THREE.MeshStandardMaterial({ color: isUnlocked ? 0x8b5a2b : 0x475569 }));
                frame.position.y = 0.1;
                frame.receiveShadow = true;
                plotMesh.add(frame);

                const soil = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.22, 2.6), new THREE.MeshStandardMaterial({ color: isUnlocked ? 0x4a2e16 : 0x334155, roughness: 0.9 }));
                soil.position.y = 0.12;
                soil.receiveShadow = true;
                plotMesh.add(soil);

                plotMesh.position.set(x, 0, z);
                scene.add(plotMesh);

                farmPlots.push({ id: i, mesh: plotMesh, soilMesh: soil, isUnlocked: isUnlocked, isTilled: false, isWatered: false, crop: null, cropMesh: null });
            }
        }

        // --- CROP MESH CREATOR (10 DISTINCT GEOMETRIES) ---
        function createCropMesh(cropType, stage, isGiant = false) {
            const group = new THREE.Group();
            const data = CROPS[cropType] || CROPS.carrot;
            const scaleFactor = isGiant ? 1.85 : 1.0;

            if (stage === 0) {
                // Sprout
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.35, 5), new THREE.MeshStandardMaterial({ color: 0x4ade80 }));
                stem.position.y = 0.18;
                group.add(stem);
                const leaf1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.08), new THREE.MeshStandardMaterial({ color: 0x22c55e }));
                leaf1.position.set(0.08, 0.3, 0);
                leaf1.rotation.z = -Math.PI / 6;
                group.add(leaf1);
            } else if (stage === 1) {
                // Bush/Stalk stage
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.65, 6), new THREE.MeshStandardMaterial({ color: data.stemColor }));
                stem.position.y = 0.32;
                group.add(stem);
                for (let i = 0; i < 3; i++) {
                    const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.03, 0.15), new THREE.MeshStandardMaterial({ color: data.stemColor }));
                    leaf.position.y = 0.25 + i * 0.12;
                    leaf.rotation.y = (i * Math.PI) / 3;
                    group.add(leaf);
                }
            } else if (stage >= 2) {
                // Fully Harvestable Crops
                const fruitMat = new THREE.MeshStandardMaterial({ color: isGiant ? 0xffd700 : data.color, roughness: 0.4, metalness: isGiant ? 0.6 : 0.1 });
                const stemMat = new THREE.MeshStandardMaterial({ color: data.stemColor, roughness: 0.7 });

                if (cropType === 'carrot') {
                    const root = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.32, 0.9, 7), fruitMat);
                    root.rotation.x = Math.PI;
                    root.position.y = 0.45;
                    group.add(root);
                    for (let i = 0; i < 4; i++) {
                        const topLeaf = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 4), stemMat);
                        topLeaf.position.set(Math.cos(i * Math.PI / 2) * 0.1, 0.95, Math.sin(i * Math.PI / 2) * 0.1);
                        group.add(topLeaf);
                    }
                } else if (cropType === 'tomato') {
                    const bStem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.8, 6), stemMat);
                    bStem.position.y = 0.4;
                    group.add(bStem);
                    const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), stemMat);
                    foliage.position.y = 0.7;
                    group.add(foliage);
                    [{ x: 0.25, y: 0.55, z: 0.15 }, { x: -0.22, y: 0.65, z: -0.1 }, { x: 0.05, y: 0.45, z: -0.25 }].forEach(p => {
                        const t = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 1), fruitMat);
                        t.position.set(p.x, p.y, p.z);
                        group.add(t);
                    });
                } else if (cropType === 'corn') {
                    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 1.4, 6), stemMat);
                    stalk.position.y = 0.7;
                    group.add(stalk);
                    const cob = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.75, 8), fruitMat);
                    cob.position.set(0.15, 0.75, 0);
                    cob.rotation.z = -0.3;
                    group.add(cob);
                } else if (cropType === 'pumpkin') {
                    for (let i = 0; i < 4; i++) {
                        const lobe = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.55, 8), fruitMat);
                        lobe.scale.set(1.2, 1.0, 0.7);
                        lobe.rotation.y = (i * Math.PI) / 4;
                        lobe.position.y = 0.38;
                        group.add(lobe);
                    }
                    const pStem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.3, 6), stemMat);
                    pStem.position.set(0, 0.7, 0);
                    group.add(pStem);
                } else if (cropType === 'eggplant') {
                    const egg = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), fruitMat);
                    egg.position.y = 0.45;
                    group.add(egg);
                    const cap = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2), stemMat);
                    cap.position.y = 0.85;
                    group.add(cap);
                } else if (cropType === 'strawberry') {
                    const berry = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 6), fruitMat);
                    berry.rotation.x = Math.PI;
                    berry.position.y = 0.35;
                    group.add(berry);
                    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.03, 0.4), stemMat);
                    cap.position.y = 0.6;
                    group.add(cap);
                } else if (cropType === 'watermelon') {
                    const melon = new THREE.Mesh(new THREE.SphereGeometry(0.48, 8, 6), fruitMat);
                    melon.scale.set(1.3, 0.9, 1.0);
                    melon.position.y = 0.4;
                    group.add(melon);
                } else if (cropType === 'sunflower') {
                    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.6, 6), stemMat);
                    stalk.position.y = 0.8;
                    group.add(stalk);
                    const flower = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.08, 10), fruitMat);
                    flower.position.set(0, 1.6, 0.1);
                    flower.rotation.x = 0.4;
                    group.add(flower);
                } else if (cropType === 'dragon_fruit') {
                    const fruit = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), fruitMat);
                    fruit.position.y = 0.5;
                    group.add(fruit);
                    for(let i=0; i<6; i++) {
                        const petal = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 4), stemMat);
                        petal.position.set(Math.sin(i)*0.3, 0.5, Math.cos(i)*0.3);
                        group.add(petal);
                    }
                } else {
                    // Golden Berry
                    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), fruitMat);
                    crystal.position.y = 0.65;
                    group.add(crystal);
                }
            }

            group.scale.set(scaleFactor, scaleFactor, scaleFactor);
            return group;
        }

        // --- PARTICLES ENGINE ---
        function spawnWaterParticles(pos) {
            for (let i = 0; i < 10; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 }));
                p.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*1.2, 0.5, (Math.random()-0.5)*1.2));
                scene.add(p);
                particles.push({ mesh: p, vel: new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2 + 1, (Math.random()-0.5)*2), life: 0.5 });
            }
        }

        function spawnSparkleParticles(pos, color = 0xfacc15) {
            for (let i = 0; i < 12; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: color }));
                p.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*0.8, 0.4, (Math.random()-0.5)*0.8));
                scene.add(p);
                particles.push({ mesh: p, vel: new THREE.Vector3((Math.random()-0.5)*3, Math.random()*3 + 1, (Math.random()-0.5)*3), life: 0.7 });
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta;
                p.mesh.position.addScaledVector(p.vel, delta);
                p.vel.y -= 9.8 * delta;
                p.mesh.scale.multiplyScalar(0.95);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- INPUT & CONTROLS ---
        function setupInputListeners() {
            window.addEventListener('keydown', (e) => {
                audio.init();
                const key = e.key.toLowerCase();
                if (['w', 'arrowup'].includes(key)) keys.w = true;
                if (['a', 'arrowleft'].includes(key)) keys.a = true;
                if (['s', 'arrowdown'].includes(key)) keys.s = true;
                if (['d', 'arrowright'].includes(key)) keys.d = true;
                if (e.code === 'Space') keys.space = true;
                if (key === 'e') performInteraction();
                if (['1','2','3','4'].includes(key)) selectHotbarSlot(parseInt(key) - 1);
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (['w', 'arrowup'].includes(key)) keys.w = false;
                if (['a', 'arrowleft'].includes(key)) keys.a = false;
                if (['s', 'arrowdown'].includes(key)) keys.s = false;
                if (['d', 'arrowright'].includes(key)) keys.d = false;
                if (e.code === 'Space') keys.space = false;
            });

            let isDragging = false, previousMouseX = 0;
            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'CANVAS') { isDragging = true; previousMouseX = e.clientX; }
            });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    cameraAngleY -= (e.clientX - previousMouseX) * 0.005;
                    previousMouseX = e.clientX;
                }
            });
            window.addEventListener('mouseup', () => isDragging = false);
        }

        function setupMobileControls() {
            const joystickBase = document.getElementById('joystick-base');
            const joystickStick = document.getElementById('joystick-stick');
            let joystickTouchId = null;

            joystickBase.addEventListener('touchstart', (e) => {
                audio.init();
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) updateJoystick(touch);
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        joystickTouchId = null;
                        joystickVector = { x: 0, y: 0 };
                        joystickStick.style.top = '35px';
                        joystickStick.style.left = '35px';
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickBase.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 45) { dx = (dx / dist) * 45; dy = (dy / dist) * 45; }
                joystickStick.style.left = `${35 + dx}px`;
                joystickStick.style.top = `${35 + dy}px`;
                joystickVector.x = dx / 45;
                joystickVector.y = dy / 45;
            }

            document.getElementById('btn-touch-interact').onclick = () => performInteraction();
            document.getElementById('btn-touch-jump').onclick = () => { if (isGrounded) { playerVelY = 7.5; isGrounded = false; } };
            document.getElementById('btn-touch-sell').onclick = () => performSellVaultAll();
        }

        // --- INTERACTION & MECHANICS ---
        function getClosestPlot() {
            let closest = null, minDist = 3.5;
            farmPlots.forEach(plot => {
                const dist = playerGroup.position.distanceTo(plot.mesh.position);
                if (dist < minDist) { minDist = dist; closest = plot; }
            });
            return closest;
        }

        function getActiveItem() {
            const slots = ['hoe', 'waterCan', 'fertilizer', gameState.equippedSeed];
            return slots[gameState.selectedSlot];
        }

        function performInteraction() {
            // Refill Water
            if (playerGroup.position.distanceTo(new THREE.Vector3(14, 0, 4)) < 4.0) {
                gameState.inventory.waterCan = gameState.waterCanCapacity;
                audio.playWater();
                spawnWaterParticles(new THREE.Vector3(14, 1, 4));
                showFloatingText("+Water Refilled", new THREE.Vector3(14, 2, 4));
                updateUI();
                saveGame();
                return;
            }

            // Market Sell
            if (playerGroup.position.distanceTo(new THREE.Vector3(-14, 0, 4)) < 4.5) {
                performSellVaultAll();
                return;
            }

            const plot = getClosestPlot();
            if (!plot || !plot.isUnlocked) return;

            const tool = getActiveItem();

            // Till
            if (tool === 'hoe' && !plot.isTilled) {
                plot.isTilled = true;
                plot.soilMesh.material.color.setHex(0x361f0d);
                audio.playPlant();
                spawnSparkleParticles(plot.mesh.position, 0x8b5a2b);
                showFloatingText("Tilled Plot", plot.mesh.position);
                saveGame();
                return;
            }

            // Plant Seed
            if (tool && tool.endsWith('_seed') && plot.isTilled && !plot.crop) {
                if (gameState.seedsInventory[tool] > 0) {
                    gameState.seedsInventory[tool]--;
                    const cropType = tool.replace('_seed', '');
                    const isGiant = Math.random() < 0.08;

                    plot.crop = { type: cropType, stage: 0, growthProgress: 0, isGiant: isGiant };
                    plot.cropMesh = createCropMesh(cropType, 0, isGiant);
                    plot.cropMesh.position.y = 0.2;
                    plot.mesh.add(plot.cropMesh);

                    audio.playPlant();
                    spawnSparkleParticles(plot.mesh.position, 0x4ade80);
                    showFloatingText(`Planted ${CROPS[cropType].name}`, plot.mesh.position);
                    updateUI();
                    saveGame();
                } else {
                    showFloatingText("No Seeds Left!", playerGroup.position);
                }
                return;
            }

            // Water
            if (tool === 'waterCan' && plot.crop && !plot.isWatered) {
                if (gameState.inventory.waterCan > 0) {
                    gameState.inventory.waterCan--;
                    plot.isWatered = true;
                    plot.soilMesh.material.color.setHex(0x1c1007);
                    audio.playWater();
                    spawnWaterParticles(plot.mesh.position);
                    showFloatingText("Watered (+Speed)", plot.mesh.position);
                    trackQuestProgress('water_crops', 1);
                    updateUI();
                    saveGame();
                } else {
                    showFloatingText("Water Can Empty!", playerGroup.position);
                }
                return;
            }

            // Fertilizer
            if (tool === 'fertilizer' && plot.crop && plot.crop.stage < 2) {
                if (gameState.inventory.fertilizer > 0) {
                    gameState.inventory.fertilizer--;
                    plot.crop.stage = 2;
                    plot.mesh.remove(plot.cropMesh);
                    plot.cropMesh = createCropMesh(plot.crop.type, 2, plot.crop.isGiant);
                    plot.mesh.add(plot.cropMesh);
                    audio.playHarvest();
                    spawnSparkleParticles(plot.mesh.position, 0xec4899);
                    showFloatingText("Instant Grown!", plot.mesh.position);
                    updateUI();
                    saveGame();
                }
                return;
            }

            // Harvest
            if (plot.crop && plot.crop.stage >= 2) {
                const cropType = plot.crop.type;
                const isGiant = plot.crop.isGiant;

                gameState.heldCrop = { type: cropType, isGiant: isGiant };
                gameState.harvestedVault[cropType] = (gameState.harvestedVault[cropType] || 0) + (isGiant ? 2 : 1);
                updatePlayerHandItem();

                const xpEarned = Math.round(CROPS[cropType].xp * (isGiant ? 3 : 1));
                addXP(xpEarned);

                audio.playHarvest();
                spawnSparkleParticles(plot.mesh.position, 0xfacc15);
                showFloatingText(`Harvested ${CROPS[cropType].name}!`, plot.mesh.position);
                trackQuestProgress('harvest_carrots', 1, cropType);

                plot.mesh.remove(plot.cropMesh);
                plot.crop = null;
                plot.cropMesh = null;
                plot.isWatered = false;
                plot.soilMesh.material.color.setHex(0x361f0d);

                updateUI();
                saveGame();
            }
        }

        function updatePlayerHandItem() {
            if (currentHandMesh) { playerHandAnchor.remove(currentHandMesh); currentHandMesh = null; }
            if (gameState.heldCrop) {
                currentHandMesh = createCropMesh(gameState.heldCrop.type, 2, gameState.heldCrop.isGiant);
                currentHandMesh.scale.set(0.9, 0.9, 0.9);
                playerHandAnchor.add(currentHandMesh);
            }
        }

        function performSellVaultAll() {
            let total = 0;
            if (gameState.heldCrop) {
                const data = CROPS[gameState.heldCrop.type];
                total += Math.round(data.sellPrice * (gameState.heldCrop.isGiant ? 4 : 1));
                gameState.heldCrop = null;
                updatePlayerHandItem();
            }

            Object.keys(gameState.harvestedVault).forEach(k => {
                const count = gameState.harvestedVault[k];
                if (count > 0 && CROPS[k]) {
                    total += count * CROPS[k].sellPrice;
                    gameState.harvestedVault[k] = 0;
                }
            });

            if (total > 0) {
                addCoins(total);
                audio.playCoin();
                spawnSparkleParticles(new THREE.Vector3(-14, 1.5, 4), 0xfacc15);
                showFloatingText(`+${total} Coins Sold!`, new THREE.Vector3(-14, 2.5, 4));
                updateUI();
                saveGame();
            } else {
                showFloatingText("No produce to sell!", playerGroup.position);
            }
        }

        function updateCropGrowth(delta) {
            farmPlots.forEach(plot => {
                if (plot.crop && plot.crop.stage < 2) {
                    const data = CROPS[plot.crop.type];
                    const growthSpeed = plot.isWatered ? 2.2 : 1.0;
                    plot.crop.growthProgress += delta * growthSpeed;

                    const targetStage = plot.crop.growthProgress >= data.growthTime ? 2 : (plot.crop.growthProgress >= data.growthTime / 2 ? 1 : 0);
                    if (targetStage !== plot.crop.stage) {
                        plot.crop.stage = targetStage;
                        plot.mesh.remove(plot.cropMesh);
                        plot.cropMesh = createCropMesh(plot.crop.type, targetStage, plot.crop.isGiant);
                        plot.mesh.add(plot.cropMesh);
                        spawnSparkleParticles(plot.mesh.position, 0x38bdf8);
                    }
                }
            });
        }

        function addCoins(amount) { gameState.coins += amount; trackQuestProgress('earn_coins', gameState.coins); updateUI(); }
        function addXP(amount) {
            gameState.xp += amount;
            const xpNeeded = gameState.level * 100;
            if (gameState.xp >= xpNeeded) {
                gameState.xp -= xpNeeded;
                gameState.level++;
                audio.playLevelUp();
                showFloatingText(`LEVEL UP! (Lvl ${gameState.level})`, playerGroup.position);
            }
            updateUI();
        }

        function trackQuestProgress(questId, amount, extraParam = null) {
            gameState.quests.forEach(q => {
                if (q.id === questId && !q.completed) {
                    if (q.cropId && extraParam !== q.cropId) return;
                    if (questId === 'earn_coins') q.progress = amount;
                    else q.progress += amount;
                    if (q.progress >= q.target) {
                        q.completed = true;
                        addCoins(q.reward);
                        addXP(q.rewardXp);
                        showFloatingText(`Quest Done! +${q.reward}G`, playerGroup.position);
                    }
                }
            });
        }

        function showFloatingText(text, worldPos) {
            const screenPos = worldPos.clone().project(camera);
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

            const el = document.createElement('div');
            el.className = 'floating-text text-xl md:text-2xl';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function selectHotbarSlot(index) { gameState.selectedSlot = index; updateUI(); }

        function updateUI() {
            document.getElementById('coin-count').innerText = gameState.coins;
            document.getElementById('level-num').innerText = gameState.level;
            document.getElementById('player-level-badge').innerText = `L${gameState.level}`;

            const xpNeeded = gameState.level * 100;
            document.getElementById('xp-text').innerText = `${gameState.xp}/${xpNeeded} XP`;
            document.getElementById('xp-bar').style.width = `${(gameState.xp / xpNeeded) * 100}%`;

            // Hotbar Rendering
            const eqSeed = CROPS[gameState.equippedSeed.replace('_seed', '')];
            const items = [
                { id: 'hoe', name: 'Hoe', icon: '🪓', count: '' },
                { id: 'waterCan', name: 'Water Can', icon: '💧', count: gameState.inventory.waterCan },
                { id: 'fertilizer', name: 'Fertilizer', icon: '🧪', count: gameState.inventory.fertilizer },
                { id: gameState.equippedSeed, name: `${eqSeed ? eqSeed.name : 'Seed'}`, icon: eqSeed ? eqSeed.icon : '🌱', count: gameState.seedsInventory[gameState.equippedSeed] || 0 }
            ];

            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';
            items.forEach((item, idx) => {
                const isActive = idx === gameState.selectedSlot;
                const slot = document.createElement('div');
                slot.className = `hotbar-slot rounded-xl flex flex-col items-center justify-center relative cursor-pointer ${isActive ? 'active' : ''}`;
                slot.innerHTML = `
                    <span class="text-2xl">${item.icon}</span>
                    ${item.count !== '' ? `<span class="absolute bottom-1 right-1 text-[10px] font-fredoka bg-slate-900/90 px-1 rounded text-amber-300">${item.count}</span>` : ''}
                    <span class="absolute top-0.5 left-1 text-[9px] font-bold text-slate-400">${idx + 1}</span>
                `;
                slot.onclick = () => selectHotbarSlot(idx);
                hotbarEl.appendChild(slot);
            });

            const activeItem = items[gameState.selectedSlot];
            document.getElementById('active-item-name').innerText = `${activeItem.name} (${gameState.selectedSlot + 1})${gameState.heldCrop ? ` | Holding: ${CROPS[gameState.heldCrop.type].name}` : ''}`;
            updateActionPrompt();
        }

        function updateActionPrompt() {
            const promptEl = document.getElementById('action-prompt');
            const promptText = document.getElementById('prompt-text');
            const touchSellBtn = document.getElementById('btn-touch-sell');
            const plot = getClosestPlot();

            if (playerGroup.position.distanceTo(new THREE.Vector3(14, 0, 4)) < 4.0) {
                promptEl.style.opacity = '1';
                promptText.innerText = 'Refill Water Can at Well';
                if (touchSellBtn) touchSellBtn.classList.add('hidden');
                return;
            }

            if (playerGroup.position.distanceTo(new THREE.Vector3(-14, 0, 4)) < 4.5) {
                promptEl.style.opacity = '1';
                promptText.innerText = 'Press E / Tap 💰 to Sell All Harvested Produce!';
                if (touchSellBtn) touchSellBtn.classList.remove('hidden');
                return;
            } else if (touchSellBtn) touchSellBtn.classList.add('hidden');

            if (plot && plot.isUnlocked) {
                promptEl.style.opacity = '1';
                if (!plot.isTilled) promptText.innerText = 'Till Dirt Plot (Use Hoe)';
                else if (!plot.crop) promptText.innerText = 'Plant Seed';
                else if (plot.crop.stage >= 2) promptText.innerText = 'Harvest Crop!';
                else if (!plot.isWatered) promptText.innerText = 'Water Crop';
                else promptText.innerText = 'Crop Growing...';
            } else {
                promptEl.style.opacity = '0';
            }
        }

        // --- MODAL RENDERING ---
        function setupModals() {
            document.getElementById('btn-fullscreen').onclick = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else if (document.exitFullscreen) document.exitFullscreen();
            };

            const shopModal = document.getElementById('shop-modal');
            const questsModal = document.getElementById('quests-modal');
            const barnModal = document.getElementById('barn-modal');
            const seedsModal = document.getElementById('seeds-modal');

            document.getElementById('btn-shop').onclick = () => { renderShopItems('seeds'); shopModal.classList.remove('hidden'); };
            document.getElementById('btn-quests').onclick = () => { renderQuests(); questsModal.classList.remove('hidden'); };
            document.getElementById('btn-barn').onclick = () => { renderBarnVault(); barnModal.classList.remove('hidden'); };
            document.getElementById('btn-seeds').onclick = () => { renderSeedsInventory(); seedsModal.classList.remove('hidden'); };

            document.querySelectorAll('.btn-close-modal').forEach(btn => {
                btn.onclick = () => { shopModal.classList.add('hidden'); questsModal.classList.add('hidden'); barnModal.classList.add('hidden'); seedsModal.classList.add('hidden'); };
            });

            document.querySelectorAll('.shop-tab').forEach(tab => {
                tab.onclick = (e) => {
                    document.querySelectorAll('.shop-tab').forEach(t => t.classList.replace('bg-blue-600', 'bg-slate-800'));
                    e.target.classList.replace('bg-slate-800', 'bg-blue-600');
                    renderShopItems(e.target.dataset.tab);
                };
            });

            document.getElementById('btn-sell-all-vault').onclick = () => { performSellVaultAll(); renderBarnVault(); };
        }

        function renderBarnVault() {
            const container = document.getElementById('vault-items-container');
            container.innerHTML = '';
            let totalValue = 0;

            Object.keys(gameState.harvestedVault).forEach(k => {
                const count = gameState.harvestedVault[k];
                const data = CROPS[k];
                if (!data) return;
                const itemTotal = count * data.sellPrice;
                totalValue += itemTotal;

                const div = document.createElement('div');
                div.className = 'roblox-panel p-3 rounded-2xl flex items-center justify-between border-slate-700';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">${data.icon}</span>
                        <div>
                            <div class="font-fredoka text-slate-100">${data.name}</div>
                            <div class="text-xs text-amber-400 font-bold">Qty: ${count} (${data.sellPrice}G ea)</div>
                        </div>
                    </div>
                    <button class="roblox-btn roblox-btn-green px-3 py-1.5 rounded-xl text-xs font-fredoka" ${count <= 0 ? 'disabled style="opacity:0.5"' : ''}>
                        Sell (${itemTotal}G)
                    </button>
                `;
                div.querySelector('button').onclick = () => {
                    if (count > 0) {
                        addCoins(itemTotal);
                        gameState.harvestedVault[k] = 0;
                        audio.playCoin();
                        renderBarnVault();
                        updateUI();
                        saveGame();
                    }
                };
                container.appendChild(div);
            });

            document.getElementById('total-vault-valuation').innerText = `Total Valuation: ${totalValue} Coins`;
        }

        function renderSeedsInventory() {
            const container = document.getElementById('seeds-items-container');
            container.innerHTML = '';

            Object.values(CROPS).forEach(crop => {
                const seedKey = `${crop.id}_seed`;
                const count = gameState.seedsInventory[seedKey] || 0;
                const isEquipped = gameState.equippedSeed === seedKey;

                const div = document.createElement('div');
                div.className = `roblox-panel p-3 rounded-2xl flex items-center justify-between ${isEquipped ? 'border-amber-400 bg-amber-950/20' : 'border-slate-700'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">${crop.icon}</span>
                        <div>
                            <div class="font-fredoka text-slate-100">${crop.name} Seeds</div>
                            <div class="text-xs text-slate-400">Pouch Qty: <span class="text-amber-400 font-bold">${count}</span></div>
                        </div>
                    </div>
                    <button class="roblox-btn ${isEquipped ? 'roblox-btn-amber' : 'roblox-btn-purple'} px-3 py-1.5 rounded-xl text-xs font-fredoka">
                        ${isEquipped ? 'Equipped' : 'Equip Hotbar'}
                    </button>
                `;
                div.querySelector('button').onclick = () => {
                    gameState.equippedSeed = seedKey;
                    renderSeedsInventory();
                    updateUI();
                    saveGame();
                };
                container.appendChild(div);
            });
        }

        function renderShopItems(tab) {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            if (tab === 'seeds') {
                Object.values(CROPS).forEach(crop => {
                    const seedKey = `${crop.id}_seed`;
                    const div = document.createElement('div');
                    div.className = 'roblox-panel p-3 rounded-2xl flex items-center justify-between border-slate-700';
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="text-3xl">${crop.icon}</span>
                            <div>
                                <div class="font-fredoka text-slate-100">${crop.name} Seeds</div>
                                <div class="text-xs text-amber-400 font-bold">Price: ${crop.seedPrice}G | Yield: ${crop.sellPrice}G</div>
                            </div>
                        </div>
                        <button class="roblox-btn roblox-btn-green px-3 py-1.5 rounded-xl text-xs font-fredoka">Buy (${crop.seedPrice}G)</button>
                    `;
                    div.querySelector('button').onclick = () => {
                        if (gameState.coins >= crop.seedPrice) {
                            addCoins(-crop.seedPrice);
                            gameState.seedsInventory[seedKey] = (gameState.seedsInventory[seedKey] || 0) + 1;
                            audio.playCoin();
                            updateUI();
                            saveGame();
                        } else showFloatingText("Not Enough Coins!", playerGroup.position);
                    };
                    container.appendChild(div);
                });
            } else if (tab === 'upgrades') {
                const waterCost = gameState.waterCanLevel * 150;
                const div1 = document.createElement('div');
                div1.className = 'roblox-panel p-3 rounded-2xl flex items-center justify-between border-slate-700';
                div1.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">💧</span>
                        <div>
                            <div class="font-fredoka text-slate-100">Water Can Upgrade</div>
                            <div class="text-xs text-slate-400">Cap: ${gameState.waterCanCapacity} -> ${gameState.waterCanCapacity + 5}</div>
                        </div>
                    </div>
                    <button class="roblox-btn px-3 py-1.5 rounded-xl text-xs font-fredoka">Upgrade (${waterCost}G)</button>
                `;
                div1.querySelector('button').onclick = () => {
                    if (gameState.coins >= waterCost) {
                        addCoins(-waterCost);
                        gameState.waterCanLevel++;
                        gameState.waterCanCapacity += 5;
                        gameState.inventory.waterCan = gameState.waterCanCapacity;
                        audio.playCoin();
                        renderShopItems('upgrades');
                        updateUI();
                        saveGame();
                    }
                };
                container.appendChild(div1);

                const div2 = document.createElement('div');
                div2.className = 'roblox-panel p-3 rounded-2xl flex items-center justify-between border-slate-700';
                div2.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">🧪</span>
                        <div>
                            <div class="font-fredoka text-slate-100">Super Fertilizer x3</div>
                            <div class="text-xs text-slate-400">Instant Grow Crops</div>
                        </div>
                    </div>
                    <button class="roblox-btn roblox-btn-amber px-3 py-1.5 rounded-xl text-xs font-fredoka">Buy (100G)</button>
                `;
                div2.querySelector('button').onclick = () => {
                    if (gameState.coins >= 100) {
                        addCoins(-100);
                        gameState.inventory.fertilizer += 3;
                        audio.playCoin();
                        updateUI();
                        saveGame();
                    }
                };
                container.appendChild(div2);
            } else if (tab === 'expansions') {
                const cost = gameState.unlockedPlots * 200;
                const canExpand = gameState.unlockedPlots < farmPlots.length;
                const div = document.createElement('div');
                div.className = 'roblox-panel p-4 rounded-2xl flex items-center justify-between border-slate-700 col-span-2';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">🌱</span>
                        <div>
                            <div class="font-fredoka text-slate-100">Unlock Farm Plot (${gameState.unlockedPlots}/${farmPlots.length})</div>
                            <div class="text-xs text-slate-400">Expand garden plot layout</div>
                        </div>
                    </div>
                    <button class="roblox-btn roblox-btn-green px-4 py-2 rounded-xl text-xs font-fredoka" ${!canExpand ? 'disabled' : ''}>
                        ${canExpand ? `Expand (${cost}G)` : 'Maxed Out!'}
                    </button>
                `;
                div.querySelector('button').onclick = () => {
                    if (canExpand && gameState.coins >= cost) {
                        addCoins(-cost);
                        gameState.unlockedPlots++;
                        buildFarmGrid();
                        audio.playCoin();
                        renderShopItems('expansions');
                        updateUI();
                        saveGame();
                    }
                };
                container.appendChild(div);
            }
        }

        function renderQuests() {
            const container = document.getElementById('quests-list');
            container.innerHTML = '';
            gameState.quests.forEach(q => {
                const div = document.createElement('div');
                div.className = `roblox-panel p-3 rounded-2xl flex justify-between items-center ${q.completed ? 'border-green-500/50 bg-green-950/20' : 'border-slate-700'}`;
                div.innerHTML = `
                    <div>
                        <div class="font-fredoka ${q.completed ? 'line-through text-slate-400' : 'text-slate-100'}">${q.text}</div>
                        <div class="text-xs text-amber-400 font-bold">Reward: ${q.reward}G + ${q.rewardXp} XP</div>
                    </div>
                    <div class="font-fredoka text-xs px-3 py-1 rounded-lg ${q.completed ? 'bg-green-600 text-white' : 'bg-slate-800 text-slate-300'}">
                        ${q.completed ? 'DONE' : `${q.progress}/${q.target}`}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MAIN ANIMATION LOOP WITH HUMANOID LIMB SWING ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Day / Night Cycle
            const sunAngle = elapsed * 0.03;
            sunLight.position.x = Math.cos(sunAngle) * 45;
            sunLight.position.y = Math.sin(sunAngle) * 45;

            const dayIcon = document.getElementById('day-icon');
            const dayTimeText = document.getElementById('day-time-text');
            if (sunLight.position.y > 0) {
                ambientLight.intensity = 0.75;
                if (dayIcon) dayIcon.innerText = '☀️';
                if (dayTimeText) dayTimeText.innerText = 'Daytime';
            } else {
                ambientLight.intensity = 0.25;
                if (dayIcon) dayIcon.innerText = '🌙';
                if (dayTimeText) dayTimeText.innerText = 'Nighttime';
            }

            // Player Physics & Movement
            let moveDir = new THREE.Vector3();
            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;

            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                moveDir.x = joystickVector.x;
                moveDir.z = joystickVector.y;
            }

            const isMoving = moveDir.lengthSq() > 0;

            if (isMoving) {
                moveDir.normalize();
                const rotatedDir = moveDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY);
                const moveSpeed = 7.5;
                playerGroup.position.x += rotatedDir.x * moveSpeed * delta;
                playerGroup.position.z += rotatedDir.z * moveSpeed * delta;

                playerGroup.rotation.y = Math.atan2(rotatedDir.x, rotatedDir.z);

                // Humanoid Limb Walking Animation Rotations
                const walkCycle = Math.sin(elapsed * 14);
                humanoidLimbs.leftArm.rotation.x = walkCycle * 0.65;
                humanoidLimbs.rightArm.rotation.x = -walkCycle * 0.65;
                humanoidLimbs.leftLeg.rotation.x = -walkCycle * 0.65;
                humanoidLimbs.rightLeg.rotation.x = walkCycle * 0.65;
            } else {
                // Reset to idle
                humanoidLimbs.leftArm.rotation.x = 0;
                humanoidLimbs.rightArm.rotation.x = 0;
                humanoidLimbs.leftLeg.rotation.x = 0;
                humanoidLimbs.rightLeg.rotation.x = 0;
            }

            // Gravity & Jump Physics
            if (keys.space && isGrounded) { playerVelY = 7.5; isGrounded = false; }
            if (!isGrounded) {
                playerGroup.position.y += playerVelY * delta;
                playerVelY -= 20 * delta;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    playerVelY = 0;
                    isGrounded = true;
                }
            }

            // Camera follow
            const targetCamPos = playerGroup.position.clone().add(cameraOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY));
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            updateCropGrowth(delta);
            updateParticles(delta);
            updateActionPrompt();

            renderer.render(scene, camera);
        }

        window.onload = function() {
            loadGame();
            init3D();
            setupModals();
            updateUI();
            animate();
        };
    </script>
</body>
