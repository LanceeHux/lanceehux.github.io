<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcForge 2D - Dynamic Industrial Welding Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0b0f19;
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }

        .font-tech {
            font-family: 'Chakra Petch', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-border {
            border-bottom: 2px solid #f59e0b;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950">

    <!-- Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HUD Overlay Top Bar -->
    <div class="absolute top-2 sm:top-4 left-2 sm:left-4 right-2 sm:right-4 z-20 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 pointer-events-none">
        <!-- Title & Status -->
        <div class="glass-panel px-3 sm:px-5 py-2 sm:py-3 rounded-xl pointer-events-auto flex items-center space-x-3 sm:space-x-4 hud-border shadow-2xl">
            <div class="bg-amber-500/20 p-2 rounded-lg text-amber-400">
                <i class="fa-solid fa-fire-burner text-lg sm:text-2xl"></i>
            </div>
            <div>
                <h1 class="font-tech text-sm sm:text-lg font-bold tracking-wider text-amber-400 uppercase">ArcForge 2D</h1>
                <p id="current-project-title" class="text-[10px] sm:text-xs text-slate-400 font-mono">MODE: Freeform Workbench</p>
            </div>
        </div>

        <!-- Mode & Controls -->
        <div class="glass-panel px-2 sm:px-4 py-2 rounded-xl pointer-events-auto flex items-center justify-between sm:justify-start space-x-1.5 sm:space-x-2 shadow-2xl overflow-x-auto max-w-full">
            <button id="btn-mode-assemble" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-[10px] sm:text-xs font-semibold font-tech tracking-wider uppercase transition-all bg-amber-500 text-slate-950 shadow-md whitespace-nowrap">
                <i class="fa-solid fa-hand-pointer mr-1"></i> 1. Move
            </button>
            <button id="btn-rotate-part" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-[10px] sm:text-xs font-semibold font-tech tracking-wider uppercase transition-all bg-slate-800 text-slate-300 hover:text-amber-400 border border-slate-700 hover:border-amber-500 whitespace-nowrap active:scale-95" title="Rotate Selected Part">
                <i class="fa-solid fa-rotate-right mr-1 text-amber-400"></i> Rotate
            </button>
            <button id="btn-mode-weld" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-[10px] sm:text-xs font-semibold font-tech tracking-wider uppercase transition-all bg-slate-800 text-slate-400 hover:text-white whitespace-nowrap">
                <i class="fa-solid fa-bolt mr-1"></i> 2. Arc Weld
            </button>
            <div class="h-5 sm:h-6 w-px bg-slate-700 mx-0.5 sm:mx-1 shrink-0"></div>
            <button id="btn-audio" class="p-1.5 sm:p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-amber-400 transition-colors shrink-0" title="Toggle Sound">
                <i class="fa-solid fa-volume-high text-xs sm:text-sm"></i>
            </button>
            <button id="btn-clear" class="p-1.5 sm:p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-rose-400 transition-colors shrink-0" title="Clear Workshop">
                <i class="fa-solid fa-trash-can text-xs sm:text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Left Side: Parts Spawner Palette -->
    <div class="absolute left-2 sm:left-4 top-24 sm:top-24 z-20 w-44 sm:w-64 glass-panel rounded-xl p-2.5 sm:p-4 shadow-2xl pointer-events-auto max-h-[calc(100vh-180px)] overflow-y-auto">
        <h2 class="font-tech text-[10px] sm:text-xs font-bold text-amber-400 uppercase tracking-widest mb-2 sm:mb-3 flex items-center">
            <i class="fa-solid fa-plus-circle mr-1.5"></i> Add Stock
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 sm:gap-2" id="parts-palette">
            <button onclick="spawnMetalPart('beam')" class="p-1.5 sm:p-2 bg-slate-800/80 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-500 rounded-lg text-left transition-all">
                <div class="text-amber-400 text-[11px] sm:text-xs font-tech font-bold">Steel Beam</div>
                <div class="text-[9px] sm:text-[10px] text-slate-400">Long structural</div>
            </button>
            <button onclick="spawnMetalPart('plate')" class="p-1.5 sm:p-2 bg-slate-800/80 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-500 rounded-lg text-left transition-all">
                <div class="text-amber-400 text-[11px] sm:text-xs font-tech font-bold">Metal Plate</div>
                <div class="text-[9px] sm:text-[10px] text-slate-400">Flat gusset</div>
            </button>
            <button onclick="spawnMetalPart('pipe')" class="p-1.5 sm:p-2 bg-slate-800/80 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-500 rounded-lg text-left transition-all">
                <div class="text-amber-400 text-[11px] sm:text-xs font-tech font-bold">Hollow Pipe</div>
                <div class="text-[9px] sm:text-[10px] text-slate-400">Round tube</div>
            </button>
            <button onclick="spawnMetalPart('angle')" class="p-1.5 sm:p-2 bg-slate-800/80 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-500 rounded-lg text-left transition-all">
                <div class="text-amber-400 text-[11px] sm:text-xs font-tech font-bold">Angle Iron</div>
                <div class="text-[9px] sm:text-[10px] text-slate-400">L-Bracket</div>
            </button>
        </div>

        <div class="mt-2.5 sm:mt-4 pt-2 sm:pt-3 border-t border-slate-800 text-[10px] sm:text-xs text-slate-400 space-y-1.5 sm:space-y-2 font-mono">
            <div class="flex justify-between">
                <span>Active Parts:</span>
                <span id="stat-parts-count" class="text-amber-400 font-bold">0</span>
            </div>
            <div class="flex justify-between">
                <span>Weld Seams:</span>
                <span id="stat-welds-count" class="text-amber-400 font-bold">0</span>
            </div>
            <div class="text-[9px] sm:text-[10px] text-slate-500 pt-1.5 border-t border-slate-800/60 leading-tight sm:leading-relaxed">
                💡 <b class="text-slate-300">Tablet Instructions:</b> Tap a part to select, tap <b class="text-amber-400">Rotate</b> button to spin, or drag to reposition.
            </div>
        </div>
    </div>

    <!-- Bottom HUD -->
    <div class="absolute bottom-2 sm:bottom-6 left-1/2 -translate-x-1/2 z-20 w-[95%] sm:w-11/12 max-w-xl glass-panel rounded-xl sm:rounded-2xl p-2.5 sm:p-4 shadow-2xl pointer-events-auto">
        <div class="flex items-center justify-between mb-1 sm:mb-2">
            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <span id="instruction-badge" class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[10px] sm:text-xs font-tech font-bold uppercase">Status</span>
                <span id="instruction-text" class="text-[10px] sm:text-xs text-slate-200 truncate max-w-[200px] sm:max-w-none">Spawn stock & drag into place!</span>
            </div>
        </div>
        <div id="heat-gauge-container" class="pt-1.5 sm:pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] sm:text-xs font-mono">
            <span class="text-slate-400 flex items-center"><i class="fa-solid fa-temperature-high mr-1 text-rose-400"></i> Heat:</span>
            <div class="w-28 sm:w-48 bg-slate-800 h-1.5 sm:h-2 rounded-full overflow-hidden border border-slate-700">
                <div id="heat-bar" class="h-full bg-gradient-to-r from-blue-500 via-amber-400 to-rose-500 rounded-full w-0 transition-all duration-75"></div>
            </div>
            <span id="heat-value" class="text-slate-300 w-10 text-right">0°C</span>
        </div>
    </div>

    <script>
        // Core Canvas Setup
        let canvas, ctx;

        let activeMode = 'assemble'; // 'assemble' or 'weld'
        let audioMuted = false;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let selectedPart = null;

        let metalParts = [];
        let weldBeads = [];
        let sparkParticles = [];
        let torchHeat = 0;

        // Weld Group Helper: Find connected component of fused parts
        function getWeldedGroup(startPart) {
            const group = [startPart];
            const visited = new Set([startPart.id]);
            const queue = [startPart];

            while (queue.length > 0) {
                const current = queue.shift();
                
                // Find all parts connected to 'current' via weld beads
                for (const other of metalParts) {
                    if (visited.has(other.id)) continue;

                    // Check if there is at least one weld bead overlapping both current and other part
                    const isConnected = weldBeads.some(b => {
                        const worldPos = getBeadWorldPos(b);
                        return isPointInPart(worldPos.x, worldPos.y, current) && isPointInPart(worldPos.x, worldPos.y, other);
                    });

                    if (isConnected) {
                        visited.add(other.id);
                        group.push(other);
                        queue.push(other);
                    }
                }
            }
            return group;
        }

        // Convert stored local bead offset back to absolute world coordinates
        function getBeadWorldPos(bead) {
            const parent = metalParts.find(p => p.id === bead.partId);
            if (!parent) return { x: bead.localX, y: bead.localY };

            const cos = Math.cos(parent.rotation);
            const sin = Math.sin(parent.rotation);
            return {
                x: parent.x + (bead.localX * cos - bead.localY * sin),
                y: parent.y + (bead.localX * sin + bead.localY * cos)
            };
        }

        // Audio Context Setup for Welding Crackle Sound
        let audioCtx = null;
        let arcNoiseNode = null;
        let arcGainNode = null;

        function initCanvas() {
            canvas = document.createElement('canvas');
            ctx = canvas.getContext('2d');
            const container = document.getElementById('canvas-container');
            if (container) {
                container.appendChild(canvas);
            } else {
                document.body.appendChild(canvas);
            }
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                arcNoiseNode = audioCtx.createBufferSource();
                arcNoiseNode.buffer = noiseBuffer;
                arcNoiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 3.0;

                arcGainNode = audioCtx.createGain();
                arcGainNode.gain.value = 0;

                arcNoiseNode.connect(filter);
                filter.connect(arcGainNode);
                arcGainNode.connect(audioCtx.destination);
                arcNoiseNode.start();
            } catch (e) {}
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Metal Part Factory
        function spawnMetalPart(type) {
            const centerX = canvas.width / 2 + (Math.random() - 0.5) * 100;
            const centerY = canvas.height / 2 + (Math.random() - 0.5) * 100;
            let part = { id: Date.now() + Math.random(), type, x: centerX, y: centerY, rotation: 0, width: 140, height: 35 };

            if (type === 'plate') { part.width = 100; part.height = 100; }
            else if (type === 'pipe') { part.width = 160; part.height = 30; }
            else if (type === 'angle') { part.width = 120; part.height = 45; }

            metalParts.push(part);
            updateStatsUI();
        }

        function clearWorkshop() {
            metalParts = [];
            weldBeads = [];
            sparkParticles = [];
            updateStatsUI();
        }

        // Check if mouse hits part
        function isPointInPart(px, py, part) {
            const dx = px - part.x;
            const dy = py - part.y;
            const cos = Math.cos(-part.rotation);
            const sin = Math.sin(-part.rotation);
            const rx = dx * cos - dy * sin;
            const ry = dx * sin + dy * cos;
            return Math.abs(rx) <= part.width / 2 && Math.abs(ry) <= part.height / 2;
        }

        function setupListeners() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let groupDragOffsets = [];

            // Touch events for mobile compatibility
            const getCanvasCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const handleStart = (e) => {
                isMouseDown = true;
                initAudio();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;

                if (activeMode === 'assemble') {
                    for (let i = metalParts.length - 1; i >= 0; i--) {
                        if (isPointInPart(mouseX, mouseY, metalParts[i])) {
                            selectedPart = metalParts[i];
                            
                            // Get all parts connected in this welded assembly group
                            const group = getWeldedGroup(selectedPart);
                            groupDragOffsets = group.map(p => ({
                                part: p,
                                offsetX: mouseX - p.x,
                                offsetY: mouseY - p.y
                            }));

                            // Move grouped parts to top of rendering stack
                            group.forEach(p => {
                                const idx = metalParts.indexOf(p);
                                if (idx > -1) {
                                    metalParts.push(metalParts.splice(idx, 1)[0]);
                                }
                            });
                            break;
                        }
                    }
                }
            };

            const handleMove = (e) => {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;

                if (isMouseDown) {
                    if (activeMode === 'assemble' && selectedPart && groupDragOffsets.length > 0) {
                        groupDragOffsets.forEach(item => {
                            item.part.x = mouseX - item.offsetX;
                            item.part.y = mouseY - item.offsetY;
                        });
                    } else if (activeMode === 'weld') {
                        performWeldingAt(mouseX, mouseY);
                    }
                }
            };

            const handleEnd = () => {
                isMouseDown = false;
                selectedPart = null;
                groupDragOffsets = [];
                if (arcGainNode) arcGainNode.gain.value = 0;
            };

            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            canvas.addEventListener('touchstart', (e) => { handleStart(e); });
            canvas.addEventListener('touchmove', (e) => { handleMove(e); if (isMouseDown) e.preventDefault(); }, { passive: false });
            window.addEventListener('touchend', handleEnd);

            // Function to rotate currently selected part or assembly group
            const rotateSelectedPart = () => {
                if (!selectedPart && metalParts.length > 0) {
                    selectedPart = metalParts[metalParts.length - 1]; // Fallback to last added part if none selected
                }
                
                if (selectedPart) {
                    const group = getWeldedGroup(selectedPart);
                    const pivotX = selectedPart.x;
                    const pivotY = selectedPart.y;
                    const angle = Math.PI / 4;
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);

                    // Rotate entire welded assembly around pivot
                    group.forEach(p => {
                        const dx = p.x - pivotX;
                        const dy = p.y - pivotY;
                        p.x = pivotX + (dx * cos - dy * sin);
                        p.y = pivotY + (dx * sin + dy * cos);
                        p.rotation += angle;
                    });
                }
            };

            // Rotate button event listener for touchscreen & tablet compatibility
            document.getElementById('btn-rotate-part').addEventListener('click', rotateSelectedPart);

            canvas.addEventListener('dblclick', (e) => {
                if (activeMode === 'assemble') {
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    for (let i = metalParts.length - 1; i >= 0; i--) {
                        if (isPointInPart(mx, my, metalParts[i])) {
                            selectedPart = metalParts[i];
                            rotateSelectedPart();
                            break;
                        }
                    }
                }
            });

            document.getElementById('btn-mode-assemble').addEventListener('click', () => setMode('assemble'));
            document.getElementById('btn-mode-weld').addEventListener('click', () => setMode('weld'));
            document.getElementById('btn-audio').addEventListener('click', () => { audioMuted = !audioMuted; });
            document.getElementById('btn-clear').addEventListener('click', clearWorkshop);

            // Initial default parts
            spawnMetalPart('beam');
            spawnMetalPart('beam');
            metalParts[1].x += 80;
            metalParts[1].rotation = Math.PI / 2;
        }

        function setMode(mode) {
            activeMode = mode;
            const btnAssemble = document.getElementById('btn-mode-assemble');
            const btnWeld = document.getElementById('btn-mode-weld');

            if (mode === 'assemble') {
                btnAssemble.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold font-tech tracking-wider uppercase bg-amber-500 text-slate-950 shadow-md";
                btnWeld.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold font-tech tracking-wider uppercase bg-slate-800 text-slate-400 hover:text-white";
                document.getElementById('instruction-text').innerText = "Tap a part to select it, then tap the Rotate button or drag to reposition.";
            } else {
                btnWeld.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold font-tech tracking-wider uppercase bg-amber-500 text-slate-950 shadow-md text-slate-950 shadow-md";
                btnAssemble.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold font-tech tracking-wider uppercase bg-slate-800 text-slate-400 hover:text-white";
                document.getElementById('instruction-text').innerText = "Drag welding gun tip across metal joint seams to bond them together!";
            }
        }

        function performWeldingAt(x, y) {
            // Find underlying metal part to bind the bead locally
            const targetPart = [...metalParts].reverse().find(p => isPointInPart(x, y, p));

            if (targetPart) {
                // Store bead in local coordinate space of the parent metal part
                const dx = x - targetPart.x;
                const dy = y - targetPart.y;
                const cos = Math.cos(-targetPart.rotation);
                const sin = Math.sin(-targetPart.rotation);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;

                weldBeads.push({
                    partId: targetPart.id,
                    localX,
                    localY,
                    radius: 6 + Math.random() * 4,
                    opacity: 1.0,
                    heat: 1.0
                });
            }

            // Generate sparks
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                sparkParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 1.0,
                    size: 1 + Math.random() * 2.5
                });
            }

            torchHeat = Math.min(100, torchHeat + 3);

            if (arcGainNode && !audioMuted) {
                arcGainNode.gain.value = 0.15 + Math.random() * 0.1;
            }
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('stat-parts-count').innerText = metalParts.length;
            document.getElementById('stat-welds-count').innerText = weldBeads.length;
        }

        function drawMetalTexture(part) {
            ctx.save();
            ctx.translate(part.x, part.y);
            ctx.rotate(part.rotation);

            const w = part.width;
            const h = part.height;

            // Outer Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            // Metallic Base Gradient
            const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
            grad.addColorStop(0, '#64748b');
            grad.addColorStop(0.3, '#94a3b8');
            grad.addColorStop(0.5, '#475569');
            grad.addColorStop(0.8, '#cbd5e1');
            grad.addColorStop(1, '#334155');

            ctx.fillStyle = grad;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;

            if (part.type === 'pipe') {
                ctx.beginPath();
                ctx.roundRect(-w/2, -h/2, w, h, h/2);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeRect(-w/2, -h/2, w, h);
            }

            // Internal Structural Lines
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1.5;

            if (part.type === 'beam') {
                ctx.strokeRect(-w/2 + 6, -h/2 + 4, w - 12, h - 8);
            } else if (part.type === 'angle') {
                ctx.beginPath();
                ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0);
                ctx.stroke();
            }

            // Highlight border if selected
            if (part === selectedPart && activeMode === 'assemble') {
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-w/2 - 3, -h/2 - 3, w + 6, h + 6);
            }

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Workshop Grid Surface
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Metal Parts
            metalParts.forEach(drawMetalTexture);

            // Draw Weld Beads (Heat & Cured Texture attached to parts)
            weldBeads.forEach(b => {
                const pos = getBeadWorldPos(b);

                ctx.save();
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, b.radius, 0, Math.PI * 2);

                if (b.heat > 0.05) {
                    // Hot Glowing Molten Core
                    ctx.fillStyle = `rgba(255, ${Math.floor(150 * b.heat)}, 0, ${b.opacity})`;
                    ctx.shadowColor = '#ff5500';
                    ctx.shadowBlur = 12 * b.heat;
                } else {
                    // Cured Nickel-Steel Metallic Weld Bead Texture
                    const bGrad = ctx.createRadialGradient(pos.x - 2, pos.y - 2, 1, pos.x, pos.y, b.radius);
                    bGrad.addColorStop(0, '#e2e8f0');
                    bGrad.addColorStop(0.5, '#64748b');
                    bGrad.addColorStop(1, '#1e293b');
                    ctx.fillStyle = bGrad;
                    ctx.shadowBlur = 0;
                }
                ctx.fill();

                // Outer Bead Rim Stitching
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();

                // Heat Decay
                if (b.heat > 0) b.heat -= 0.01;
            });

            // Draw Spark Particles
            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const p = sparkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 0.03;

                if (p.life <= 0) {
                    sparkParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.fillStyle = `rgba(255, ${Math.floor(200 * p.life)}, 50, ${p.life})`;
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Welding Gun Torch in Weld Mode
            if (activeMode === 'weld') {
                ctx.save();
                ctx.translate(mouseX, mouseY);

                // Torch Nozzle
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.moveTo(-10, 20); ctx.lineTo(10, 20); ctx.lineTo(4, 0); ctx.lineTo(-4, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Torch Tip Cone
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.lineTo(0, -10);
                ctx.closePath();
                ctx.fill();

                // Electric Arc Glow when firing
                if (isMouseDown) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.shadowColor = '#60a5fa';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(0, -10, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Heat Gauge Decay
            if (torchHeat > 0) torchHeat = Math.max(0, torchHeat - 0.4);
            document.getElementById('heat-bar').style.width = `${torchHeat}%`;
            document.getElementById('heat-value').innerText = `${Math.round(torchHeat * 15)}°C`;

            requestAnimationFrame(render);
        }

        window.onload = () => {
            initCanvas();
            setupListeners();
            render();
        };
    </script>
</body>
</html>
