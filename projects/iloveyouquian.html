<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Gesture Text Magic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#111827',
                        neonCyan: '#00f2fe',
                        neonPink: '#ff007f',
                        neonPurple: '#b026ff',
                        neonYellow: '#ffe600'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for sleek icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
            touch-action: none;
        }
        .display-font {
            font-family: 'Outfit', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
            border-radius: 9999px;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe, 0 0 40px #00f2fe, 0 0 80px #00f2fe;
        }
        .neon-glow-pink {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 80px #ff007f;
        }
        .neon-glow-yellow {
            text-shadow: 0 0 10px #ffe600, 0 0 20px #ffe600, 0 0 40px #ffe600, 0 0 80px #ffe600;
        }
        .neon-glow-purple {
            text-shadow: 0 0 10px #b026ff, 0 0 20px #b026ff, 0 0 40px #b026ff, 0 0 80px #b026ff;
        }
        @keyframes float-anim {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        .floating-text {
            animation: float-anim 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col relative select-none">

    <!-- Header / Navbar -->
    <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-6 py-4 glass-panel border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-pink-500 to-purple-500 flex items-center justify-center shadow-lg shadow-pink-500/30">
                <i class="fa-solid fa-hand-sparkles text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-cyan-400 via-pink-400 to-yellow-300 bg-clip-text text-transparent display-font">Neon Gesture Magic</h1>
                <p class="text-xs text-gray-400">1: I | 2: LOVE | 3: YOU | 4: QUIAN</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Status Badge -->
            <div id="status-badge" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="status-text">Loading AI Model...</span>
            </div>

            <!-- FPS Indicator -->
            <div class="hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-gray-800/80 border border-gray-700 text-gray-300 text-xs font-mono">
                <i class="fa-solid fa-gauge-high text-cyan-400"></i>
                <span id="fps-display">0 FPS</span>
            </div>

            <!-- Mirror Video Toggle -->
            <button id="btn-mirror" title="Mirror Camera" class="p-2.5 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-300 hover:text-white transition border border-gray-700">
                <i class="fa-solid fa-arrows-split-up-and-left text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="relative flex-1 w-full h-full flex items-center justify-center bg-black overflow-hidden">
        
        <!-- Video Element -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none opacity-85" autoplay playsinline muted></video>

        <!-- Canvas for Skeleton & Particle Effects -->
        <canvas id="output-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

        <!-- Dynamic Giant Gesture Text Overlay -->
        <div id="gesture-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none transition-all duration-300">
            <!-- Dynamically populated main text -->
            <div id="giant-text" class="display-font font-black text-7xl md:text-9xl uppercase tracking-wider opacity-0 transform scale-50 transition-all duration-300 text-center"></div>
            <div id="gesture-subtext" class="mt-4 px-6 py-2 rounded-full glass-panel text-white/80 text-sm font-medium tracking-widest uppercase opacity-0 transform translate-y-4 transition-all duration-300 shadow-2xl"></div>
        </div>

        <!-- Toast Notification Box -->
        <div id="toast" class="absolute top-24 left-1/2 transform -translate-x-1/2 z-40 px-4 py-2 rounded-xl glass-panel text-sm text-white shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2">
            <i id="toast-icon" class="fa-solid fa-circle-info text-cyan-400"></i>
            <span id="toast-message">Notification message</span>
        </div>

        <!-- Floating HUD Quick Legend Panel -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-30 flex flex-wrap items-center justify-center gap-3 px-6 py-3 rounded-2xl glass-panel shadow-2xl">
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-gray-900/60 border border-gray-800">
                <span class="w-6 h-6 rounded-lg bg-cyan-500/20 text-cyan-400 font-bold text-xs flex items-center justify-center border border-cyan-500/40">1</span>
                <span class="text-xs text-gray-300 font-medium">I</span>
            </div>
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-gray-900/60 border border-gray-800">
                <span class="w-6 h-6 rounded-lg bg-pink-500/20 text-pink-400 font-bold text-xs flex items-center justify-center border border-pink-500/40">2</span>
                <span class="text-xs text-gray-300 font-medium">LOVE</span>
            </div>
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-gray-900/60 border border-gray-800">
                <span class="w-6 h-6 rounded-lg bg-yellow-500/20 text-yellow-400 font-bold text-xs flex items-center justify-center border border-yellow-500/40">3</span>
                <span class="text-xs text-gray-300 font-medium">YOU</span>
            </div>
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-gray-900/60 border border-gray-800">
                <span class="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 font-bold text-xs flex items-center justify-center border border-purple-500/40">4</span>
                <span class="text-xs text-gray-300 font-medium">QUIAN</span>
            </div>
        </div>

    </main>

    <!-- Application Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.getElementById('webcam');
            const canvasElement = document.getElementById('output-canvas');
            const ctx = canvasElement.getContext('2d');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const fpsDisplay = document.getElementById('fps-display');
            const btnMirror = document.getElementById('btn-mirror');
            
            const giantText = document.getElementById('giant-text');
            const gestureSubtext = document.getElementById('gesture-subtext');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            let isMirrored = true;
            let lastGesture = -1;
            let particleArray = [];

            // FPS calculation variables
            let frameCount = 0;
            let lastFpsUpdate = performance.now();
            let currentFps = 0;

            // Resize Canvas
            function resizeCanvas() {
                canvasElement.width = window.innerWidth;
                canvasElement.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Toast Notification Helper
            let toastTimeout = null;
            function showToast(message, iconClass = "fa-solid fa-circle-info") {
                document.getElementById('toast-icon').className = iconClass + " text-cyan-400";
                toastMessage.textContent = message;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2500);
            }

            // Mirror Toggle
            btnMirror.addEventListener('click', () => {
                isMirrored = !isMirrored;
                if (isMirrored) {
                    videoElement.classList.add('transform', '-scale-x-100');
                    showToast("Camera Mirrored", "fa-solid fa-arrows-split-up-and-left");
                } else {
                    videoElement.classList.remove('transform', '-scale-x-100');
                    showToast("Camera Unmirrored", "fa-solid fa-arrow-right");
                }
            });

            // Particle Class for Sparkles around hand
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.size = Math.random() * 6 + 2;
                    this.speedX = (Math.random() - 0.5) * 6;
                    this.speedY = (Math.random() - 0.5) * 6;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.03 + 0.02;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= this.decay;
                }
                draw(context) {
                    context.save();
                    context.globalAlpha = Math.max(0, this.life);
                    context.fillStyle = this.color;
                    context.shadowColor = this.color;
                    context.shadowBlur = 12;
                    context.beginPath();
                    context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    context.fill();
                    context.restore();
                }
            }

            function spawnParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    particleArray.push(new Particle(x, y, color));
                }
            }

            // Gesture logic based on raised fingers
            function countRaisedFingers(landmarks) {
                // Landmark indices:
                // Thumb: tip 4, ip 3, mcp 2
                // Index: tip 8, pip 6
                // Middle: tip 12, pip 10
                // Ring: tip 16, pip 14
                // Pinky: tip 20, pip 18
                
                let raisedCount = 0;

                // Hand handedness check or simple vertical orientation heuristic
                // For index, middle, ring, pinky: compare tip Y with PIP Y (smaller Y is higher on screen)
                const fingers = [
                    { tip: 8, pip: 6 },
                    { tip: 12, pip: 10 },
                    { tip: 16, pip: 14 },
                    { tip: 20, pip: 18 }
                ];

                fingers.forEach(f => {
                    if (landmarks[f.tip].y < landmarks[f.pip].y) {
                        raisedCount++;
                    }
                });

                // Thumb check (compare tip 4 with mcp 2 or ip 3 depending on hand orientation, let's use distance from wrist or x-axis relative to mcp)
                // Simplified stable thumb check: check distance between thumb tip (4) and pinky mcp (17) or index mcp (5)
                const thumbTip = landmarks[4];
                const indexMcp = landmarks[5];
                const wrist = landmarks[0];
                
                // If thumb tip is extended outward horizontally or vertically from palm center
                const thumbDist = Math.hypot(thumbTip.x - indexMcp.x, thumbTip.y - indexMcp.y);
                if (thumbDist > 0.12) {
                    raisedCount++;
                }

                return Math.min(5, raisedCount);
            }

            function updateUIForGesture(count, handX, handY) {
                if (count === lastGesture) return;
                lastGesture = count;

                // Reset classes
                giantText.className = "display-font font-black text-7xl md:text-9xl uppercase tracking-wider transition-all duration-300 text-center";
                giantText.classList.remove('floating-text', 'neon-glow-cyan', 'neon-glow-pink', 'neon-glow-yellow', 'neon-glow-purple');
                gestureSubtext.classList.remove('opacity-100', 'translate-y-0');
                gestureSubtext.classList.add('opacity-0', 'translate-y-4');

                if (count === 1) {
                    giantText.textContent = "I";
                    giantText.classList.add('neon-glow-cyan', 'text-cyan-400', 'opacity-100', 'scale-100', 'floating-text');
                    gestureSubtext.textContent = "Gesture: 1 Finger • Expression of Self";
                    gestureSubtext.classList.remove('opacity-0', 'translate-y-4');
                    gestureSubtext.classList.add('opacity-100', 'translate-y-0');
                    spawnParticles(handX, handY, 35, '#00f2fe');
                } else if (count === 2) {
                    giantText.textContent = "LOVE";
                    giantText.classList.add('neon-glow-pink', 'text-pink-500', 'opacity-100', 'scale-100', 'floating-text');
                    gestureSubtext.textContent = "Gesture: 2 Fingers • Pure Affection";
                    gestureSubtext.classList.remove('opacity-0', 'translate-y-4');
                    gestureSubtext.classList.add('opacity-100', 'translate-y-0');
                    spawnParticles(handX, handY, 45, '#ff007f');
                } else if (count === 3) {
                    giantText.textContent = "YOU";
                    giantText.classList.add('neon-glow-yellow', 'text-yellow-400', 'opacity-100', 'scale-100', 'floating-text');
                    gestureSubtext.textContent = "Gesture: 3 Fingers • Dedicated Connection";
                    gestureSubtext.classList.remove('opacity-0', 'translate-y-4');
                    gestureSubtext.classList.add('opacity-100', 'translate-y-0');
                    spawnParticles(handX, handY, 45, '#ffe600');
                } else if (count >= 4) {
                    giantText.textContent = "QUIAN";
                    giantText.classList.add('neon-glow-purple', 'text-purple-400', 'opacity-100', 'scale-100', 'floating-text');
                    gestureSubtext.textContent = `Gesture: ${count} Fingers • Special Name`;
                    gestureSubtext.classList.remove('opacity-0', 'translate-y-4');
                    gestureSubtext.classList.add('opacity-100', 'translate-y-0');
                    spawnParticles(handX, handY, 60, '#b026ff');
                } else {
                    giantText.classList.add('opacity-0', 'scale-50');
                    lastGesture = 0;
                }
            }

            // MediaPipe Results Handler
            function onResults(results) {
                // Update FPS
                frameCount++;
                const now = performance.now();
                if (now - lastFpsUpdate >= 1000) {
                    currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                    fpsDisplay.textContent = `${currentFps} FPS`;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }

                // Update Status Badge
                statusBadge.className = "flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium";
                statusText.textContent = "AI Tracking Active";

                // Clear Canvas
                ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                // Render Particles
                for (let i = particleArray.length - 1; i >= 0; i--) {
                    particleArray[i].update();
                    particleArray[i].draw(ctx);
                    if (particleArray[i].life <= 0) {
                        particleArray.splice(i, 1);
                    }
                }

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // Draw Skeleton Connections & Neon Points
                    drawHandSkeleton(landmarks);

                    // Count fingers
                    const fingersUp = countRaisedFingers(landmarks);

                    // Palm center for particle emitter
                    let palmX = landmarks[9].x * canvasElement.width;
                    const palmY = landmarks[9].y * canvasElement.height;
                    if (isMirrored) {
                        palmX = canvasElement.width - palmX;
                    }

                    updateUIForGesture(fingersUp, palmX, palmY);
                } else {
                    // No hand detected, fade out text if idle for a while
                    if (lastGesture !== 0) {
                        updateUIForGesture(0, 0, 0);
                    }
                }
            }

            // Draw futuristic neon hand skeleton
            const CONNECTIONS = [
                [0,1],[1,2],[2,3],[3,4], // Thumb
                [0,5],[5,6],[6,7],[7,8], // Index
                [5,9],[9,10],[10,11],[11,12], // Middle
                [9,13],[13,14],[14,15],[15,16], // Ring
                [13,17],[17,18],[18,19],[19,20], // Pinky
                [0,17] // Palm base
            ];

            function drawHandSkeleton(landmarks) {
                ctx.save();
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 15;
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.7)';

                // Draw connections
                CONNECTIONS.forEach(([start, end]) => {
                    const p1 = landmarks[start];
                    const p2 = landmarks[end];
                    
                    let x1 = p1.x * canvasElement.width;
                    let y1 = p1.y * canvasElement.height;
                    let x2 = p2.x * canvasElement.width;
                    let y2 = p2.y * canvasElement.height;

                    if (isMirrored) {
                        x1 = canvasElement.width - x1;
                        x2 = canvasElement.width - x2;
                    }

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                });

                // Draw Landmark Nodes
                landmarks.forEach((lm, idx) => {
                    let x = lm.x * canvasElement.width;
                    let y = lm.y * canvasElement.height;
                    if (isMirrored) {
                        x = canvasElement.width - x;
                    }

                    ctx.fillStyle = idx === 4 || idx === 8 || idx === 12 || idx === 16 || idx === 20 ? '#ff007f' : '#ffffff';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(x, y, idx === 8 ? 7 : 4, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }

            // Initialize MediaPipe Hands
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);

            // Initialize Camera
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });

            camera.start()
                .then(() => {
                    showToast("Webcam & AI Model Loaded Successfully!", "fa-solid fa-video");
                })
                .catch(err => {
                    console.error("Camera access error:", err);
                    statusBadge.className = "flex items-center space-x-2 px-3 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium";
                    statusText.textContent = "Camera Access Denied/Error";
                    showToast("Please allow camera permissions to use gesture detection.", "fa-solid fa-triangle-exclamation");
                });
        });
    </script>
</body>
</html>
