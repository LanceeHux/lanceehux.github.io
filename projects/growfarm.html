<script>
const $=i=>document.getElementById(i),R=Math.random,PI=Math.PI,KEY='grow_farm_v8';
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
const add=(p,g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
function tex(base,n,cols,rep,w=3,h=3){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);x.globalAlpha=.55;for(let i=0;i<n;i++){x.fillStyle=cols[i%cols.length];x.fillRect(R()*256,R()*256,w*(.5+R()),h*(.5+R()))}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return t}
const CL=[['carrot','Carrot','🥕',10,22,8,0xff7a00,12,1],['strawberry','Strawberry','🍓',20,46,11,0xe11d48,20,2],['tomato','Tomato','🍅',35,80,15,0xe62020,30,3],['corn','Corn','🌽',60,140,22,0xffd900,55,4],['sunflower','Sunflower','🌻',100,230,28,0xfacc15,80,5],['pumpkin','Pumpkin','🎃',160,360,36,0xff6a00,120,6],['watermelon','Watermelon','🍉',240,520,44,0x16a34a,170,8],['mushroom','Glow Shroom','🍄',320,760,48,0x38bdf8,230,10],['golden_berry','Golden Berry','🫐',450,1100,56,0xffc400,330,12]];
const C={};CL.forEach(a=>C[a[0]]={id:a[0],n:a[1],i:a[2],sp:a[3],sl:a[4],t:a[5],c:a[6],xp:a[7],lv:a[8]});
const W={fist:{n:'Bare Fists',i:'👊',d:25,p:0},wood:{n:'Wooden Sword',i:'🗡️',d:50,p:150},iron:{n:'Iron Sword',i:'⚔️',d:90,p:400},wand:{n:'Magic Wand',i:'🪄',d:160,p:900}};
const WX=[{k:'Clear',l:'☀️ Clear'},{k:'Rain',l:'🌧️ Rain',e:'wet',b:1.5},{k:'Storm',l:'⚡ Storm',e:'glowing',b:2.5},{k:'Snow',l:'❄️ Snow',e:'frozen',b:2}];
const def=()=>({started:0,mode:'Peaceful',coins:150,xp:0,lv:1,slot:0,unlocked:4,cap:10,wl:1,ctrl:1,weapon:'fist',ow:['fist'],seed:'carrot_seed',held:null,vault:[],seeds:{carrot_seed:6,strawberry_seed:0,tomato_seed:2},water:10,fert:3,plots:[],wx:0,wt:60,
quests:[{id:'h',t:'Harvest 5 crops',n:5,p:0,r:80,x:60},{id:'w',t:'Water 10 times',n:10,p:0,r:80,x:60},{id:'c',t:'Reach 500 coins',n:500,p:0,r:150,x:100},{id:'b',t:'Harvest a HUGE+ crop',n:1,p:0,r:400,x:250}]});
let S=def();
function save(){S.plots=P.map(p=>({t:p.til,m:+p.m.toFixed(2),c:p.crop}));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return 0;S=Object.assign(def(),s);return 1}catch(e){return 0}}
// audio
const A={c:null,t(f,ty='sine',d=.1,g=.2){if(!this.c)return;const o=this.c.createOscillator(),v=this.c.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,this.c.currentTime);v.gain.exponentialRampToValueAtTime(.001,this.c.currentTime+d);o.connect(v);v.connect(this.c.destination);o.start();o.stop(this.c.currentTime+d)},
seq(a,ty,d,g){a.forEach((f,i)=>setTimeout(()=>this.t(f,ty,d,g),i*70))},init(){if(!this.c)try{this.c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}};
const sPlant=()=>A.seq([300,450],'sine',.12,.25),sWater=()=>A.seq([600,720,880],'triangle',.08,.15),sHarv=()=>A.seq([523,659,784,1046],'sine',.2,.22),sCoin=()=>A.seq([988,1318],'sine',.15,.25),sLvl=()=>A.seq([400,500,600,800,1000,1200],'triangle',.25,.22);
function tier(){const r=R();if(r<.55)return{label:'Small',mult:1,scale:1,weight:+(R()*1.5+.5).toFixed(1)};if(r<.82)return{label:'Medium',mult:2,scale:1.35,weight:+(R()*4+2).toFixed(1)};if(r<.94)return{label:'Large',mult:6,scale:1.9,weight:+(R()*15+10).toFixed(1)};if(r<.99)return{label:'HUGE 🌟',mult:20,scale:2.8,weight:+(R()*60+35).toFixed(1)};return{label:'COLOSSAL 👑',mult:60,scale:4,weight:+(R()*180+120).toFixed(1)}}
// ---------- crop models
function fruit(id,g,c){const f=mat(c,{roughness:.35}),l=mat(0x2f9e44),A_=(geo,m,x,y,z)=>add(g,geo,m,x,y,z),S_=THREE.SphereGeometry;
const leaves=(n,y,r,m)=>{for(let i=0;i<n;i++){const a=i/n*PI*2,o=A_(new S_(.2,8,6),m,Math.cos(a)*r,y,Math.sin(a)*r);o.scale.set(1.4,.15,.7);o.rotation.y=-a;o.rotation.z=.3}};
if(id=='carrot'){const r=A_(new THREE.ConeGeometry(.26,1,12),f,0,.5,0);r.rotation.x=PI;for(let i=0;i<3;i++)A_(new THREE.TorusGeometry(.2-i*.05,.012,6,12),mat(0xc25a00),0,.75-i*.2,0).rotation.x=PI/2;for(let i=0;i<7;i++){const a=i/7*PI*2,t=A_(new THREE.ConeGeometry(.07,.65,5),l,Math.cos(a)*.1,1.25,Math.sin(a)*.1);t.rotation.set(Math.sin(a)*.5,0,-Math.cos(a)*.5)}}
else if(id=='strawberry'){leaves(6,.2,.25,l);[[.2,.2],[-.2,.12],[0,-.25]].forEach(([x,z],k)=>{const b=A_(new S_(.18,12,10),f,x,.28,z);b.scale.y=1.25;for(let i=0;i<9;i++){const a=i*2.4,y=-.1+i*.05,s=A_(new S_(.016,4,4),mat(0xfde047),x+Math.cos(a)*.17,.28+y,z+Math.sin(a)*.17)}for(let i=0;i<5;i++){const a=i/5*PI*2,t=A_(new THREE.ConeGeometry(.05,.14,4),l,x+Math.cos(a)*.07,.5,z+Math.sin(a)*.07);t.rotation.set(Math.sin(a),0,-Math.cos(a))}})}
else if(id=='tomato'){A_(new THREE.CylinderGeometry(.05,.08,1,6),l,0,.5,0);const fo=A_(new THREE.DodecahedronGeometry(.45,1),l,0,.9,0);fo.scale.y=.8;[[.35,.6,.1],[-.3,.7,-.15],[.05,.5,-.35],[-.05,.55,.32]].forEach(([x,y,z])=>{const t=A_(new S_(.2,14,12),f,x,y,z);t.scale.y=.85;for(let i=0;i<5;i++){const a=i/5*PI*2,s=A_(new THREE.ConeGeometry(.04,.14,4),l,x+Math.cos(a)*.06,y+.17,z+Math.sin(a)*.06);s.rotation.set(Math.sin(a)*1.2,0,-Math.cos(a)*1.2)}})}
else if(id=='corn'){A_(new THREE.CylinderGeometry(.06,.09,1.6,7),l,0,.8,0);for(let i=0;i<6;i++){const a=i/6*PI*2,o=A_(new THREE.BoxGeometry(.08,.04,.9),l,Math.cos(a)*.3,1+i*.1,Math.sin(a)*.3);o.rotation.y=-a+PI/2;o.rotation.x=.4}const cob=A_(new THREE.CylinderGeometry(.14,.1,.7,10),f,.2,.9,0);cob.rotation.z=-.35;for(let i=0;i<3;i++){const h=A_(new THREE.ConeGeometry(.12,.7,5),l,.14+Math.cos(i*2.1)*.07,.78,Math.sin(i*2.1)*.07);h.rotation.z=-.3}}
else if(id=='sunflower'){A_(new THREE.CylinderGeometry(.05,.07,1.5,7),l,0,.75,0);const h=new THREE.Group();h.position.set(0,1.55,.1);h.rotation.x=-.4;g.add(h);add(h,new THREE.CylinderGeometry(.28,.28,.1,16),mat(0x5b3a1a),0,0,0).rotation.x=PI/2;for(let i=0;i<18;i++){const a=i/18*PI*2,p=add(h,new THREE.ConeGeometry(.07,.32,4),f,Math.cos(a)*.38,Math.sin(a)*.38,0);p.rotation.z=a-PI/2}leaves(4,.5,.25,l)}
else if(id=='pumpkin'){for(let i=0;i<8;i++){const a=i/8*PI*2,o=A_(new S_(.28,12,10),f,Math.cos(a)*.17,.32,Math.sin(a)*.17);o.scale.set(.8,.9,.8);o.rotation.y=-a}A_(new THREE.CylinderGeometry(.04,.07,.25,6),l,0,.7,0).rotation.z=.2;leaves(4,.15,.5,l)}
else if(id=='watermelon'){const cv=document.createElement('canvas');cv.width=64;cv.height=8;const x=cv.getContext('2d');x.fillStyle='#22a24a';x.fillRect(0,0,64,8);x.fillStyle='#0b5d2a';for(let i=0;i<64;i+=8)x.fillRect(i,0,3,8);const m=A_(new S_(.45,24,18),mat(0xffffff,{map:new THREE.CanvasTexture(cv),roughness:.3}),0,.42,0);m.scale.set(1.25,.9,.9);A_(new THREE.CylinderGeometry(.03,.04,.15,5),l,0,.85,0);leaves(5,.1,.6,l)}
else if(id=='mushroom'){const cap=mat(0x38bdf8,{emissive:0x0ea5e9,emissiveIntensity:.7,roughness:.4});[[0,0,1],[.4,.3,.6],[-.35,.25,.5]].forEach(([x,z,s])=>{A_(new THREE.CylinderGeometry(.07*s,.1*s,.5*s,8),mat(0xe2e8f0),x,.25*s,z);const c2=A_(new S_(.32*s,16,10,0,PI*2,0,PI/2),cap,x,.5*s,z);for(let i=0;i<5;i++){const a=i*1.3;A_(new S_(.05*s,6,6),mat(0xffffff,{emissive:0xffffff,emissiveIntensity:.6}),x+Math.cos(a)*.17*s,.62*s,z+Math.sin(a)*.17*s)}})}
else{const gm=mat(0xffc400,{emissive:0xff9d00,emissiveIntensity:.55,metalness:.8,roughness:.2});A_(new THREE.CylinderGeometry(.05,.07,.8,6),mat(0x7c3aed),0,.4,0);for(let i=0;i<8;i++){const a=i*2.4,o=A_(new S_(.13,14,12),gm,Math.cos(a)*.28,.45+i*.07,Math.sin(a)*.28)}A_(new THREE.OctahedronGeometry(.22),gm,0,1,0);leaves(5,.3,.3,mat(0x7c3aed))}}
function crop(id,st,tag,sc){const g=new THREE.Group(),l=mat(0x3aa655);
if(st==0){add(g,new THREE.CylinderGeometry(.03,.04,.35,6),mat(0x4ade80),0,.17,0);[-1,1].forEach(s=>{const a=add(g,new THREE.SphereGeometry(.12,8,6),l,s*.1,.35,0);a.scale.set(1,.2,.6);a.rotation.z=s*.5})}
else if(st==1){add(g,new THREE.CylinderGeometry(.05,.08,.8,6),l,0,.4,0);for(let i=0;i<8;i++){const a=i/8*PI*2,o=add(g,new THREE.SphereGeometry(.2,8,6),l,Math.cos(a)*.22,.3+i*.07,Math.sin(a)*.22);o.scale.set(1.4,.18,.7);o.rotation.y=-a;o.rotation.z=.4}}
else fruit(id,g,C[id].c);
if(tag)g.traverse(o=>{if(!o.isMesh)return;if(tag=='glowing'){o.material.emissive=new THREE.Color(0xa855f7);o.material.emissiveIntensity=.55}else if(tag=='wet')o.material.color.multiplyScalar(.6);else o.material.color.lerp(new THREE.Color(0x9ccbff),.55)});
g.scale.setScalar(sc||1);return g}
// ---------- world
let scene,cam,ren,clk,sun,amb,player,limb={},hand,wHand,curW=null,curH=null,P=[],parts=[],mons=[],cols=[],clouds=[],flies=[],bfs=[],lamps=[],mill,wp=null,night=0,ghosts=0,camA=0,pvy=0,gnd=true,jv={x:0,y:0},K={},mk,selT=0;
let camPitch = -0.45;    // Current vertical pitch angle
let targetPitch = -0.45; // Smooth target pitch angle

let camDist = 14;        // Current zoom distance
let targetDist = 14;
const sky=new THREE.Color(0x87ceeb),skyN=new THREE.Color(0x0b1026);
function env(){const g=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0xffffff,{map:tex('#3f8f4a',1800,['#4fa85b','#2e7a3b','#68bd6f'],40,2,6),roughness:1}));g.rotation.x=-PI/2;g.receiveShadow=true;scene.add(g);
const pm=mat(0xffffff,{map:tex('#7b8494',300,['#5b6577','#98a1b2','#475066'],4,14,10)});[[4,44,0,47],[34,3,0,14]].forEach(([w,h,x,z])=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pm);p.rotation.x=-PI/2;p.position.set(x,.02,z);p.receiveShadow=true;scene.add(p)});
